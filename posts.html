<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Posts — Qalb-e-Deen</title>

  <meta
    name="description"
    content="Read Islamic posts, reminders and reflections on Qalb-e-Deen."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #061b16;
      color: #fff;
      min-height: 100vh;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(6, 27, 22, .95);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .nav {
      max-width: 1100px;
      margin: auto;
      padding: 16px 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      text-decoration: none;
      color: #d8b46a;
      font-size: 24px;
      font-weight: bold;
    }

    .nav-links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: #c9d2cf;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
    }

    .nav-links a:hover {
      background: rgba(216,180,106,.1);
      color: #d8b46a;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      max-width: 1100px;
      margin: auto;
      padding: 65px 20px 45px;
      text-align: center;
    }

    .hero-badge {
      display: inline-block;
      padding: 7px 14px;
      border-radius: 30px;
      background: rgba(216,180,106,.12);
      color: #d8b46a;
      font-size: 12px;
      margin-bottom: 15px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .hero h1 span {
      color: #d8b46a;
    }

    .hero p {
      max-width: 650px;
      margin: auto;
      color: #aebbb6;
      line-height: 1.7;
      font-size: 16px;
    }

    /* =========================
       POSTS
    ========================= */

    .posts-container {
      max-width: 850px;
      margin: auto;
      padding: 0 20px 70px;
    }

    .section-title {
      font-size: 22px;
      margin-bottom: 20px;
      color: #d8b46a;
    }

    .posts-grid {
      display: grid;
      gap: 22px;
    }

    .post-card {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      overflow: hidden;
      transition: .25s;
    }

    .post-card:hover {
      transform: translateY(-3px);
      border-color: rgba(216,180,106,.35);
    }

    .post-image {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
      background: #10251f;
    }

    .post-content {
      padding: 24px;
    }

    .post-category {
      display: inline-block;
      color: #d8b46a;
      background: rgba(216,180,106,.1);
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 11px;
      margin-bottom: 12px;
    }

    .post-title {
      font-size: 25px;
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .post-excerpt {
      color: #aebbb6;
      line-height: 1.7;
      margin-bottom: 17px;
      white-space: pre-line;
    }

    .post-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-top: 15px;
      border-top: 1px solid rgba(255,255,255,.08);
      color: #7f8d88;
      font-size: 12px;
    }

    .read-btn {
      display: inline-block;
      margin-top: 15px;
      color: #061b16;
      background: #d8b46a;
      text-decoration: none;
      padding: 11px 17px;
      border-radius: 9px;
      font-weight: bold;
      font-size: 13px;
    }

    /* =========================
       LOADING / EMPTY / ERROR
    ========================= */

    .state {
      text-align: center;
      padding: 60px 20px;
      color: #aebbb6;
    }

    .loader {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(216,180,106,.2);
      border-top-color: #d8b46a;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 18px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error-box {
      background: rgba(231,76,60,.1);
      border: 1px solid rgba(231,76,60,.2);
      color: #ffaaa2;
      border-radius: 12px;
      padding: 18px;
      line-height: 1.6;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      border-top: 1px solid rgba(255,255,255,.08);
      text-align: center;
      padding: 30px 20px;
      color: #71807b;
      font-size: 13px;
    }

    footer strong {
      color: #d8b46a;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 650px) {

      .nav {
        flex-direction: column;
      }

      .nav-links {
        justify-content: center;
      }

      .hero {
        padding-top: 45px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .post-image {
        height: 200px;
      }

      .post-title {
        font-size: 21px;
      }

      .post-content {
        padding: 19px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <div class="nav">

      <a href="index.html" class="logo">
        Qalb-e-Deen
      </a>

      <nav class="nav-links">

        <a href="index.html">
          Home
        </a>

        <a href="quran.html">
          Quran
        </a>

        <a href="hadith.html">
          Hadith
        </a>

        <a href="posts.html">
          Posts
        </a>

        <a href="profile.html">
          Profile
        </a>

      </nav>

    </div>

  </header>


  <!-- =========================
       HERO
  ========================= -->

  <section class="hero">

    <div class="hero-badge">
      QALB-E-DEEN • THE HEART OF DEEN
    </div>

    <h1>
      Islamic <span>Posts</span>
    </h1>

    <p>
      Read reminders, reflections, Islamic knowledge
      and beneficial posts from Qalb-e-Deen.
    </p>

  </section>


  <!-- =========================
       POSTS
  ========================= -->

  <main class="posts-container">

    <h2 class="section-title">
      Latest Posts
    </h2>

    <div id="postsList" class="posts-grid">

      <div class="state">

        <div class="loader"></div>

        Loading posts...

      </div>

    </div>

  </main>


  <!-- =========================
       FOOTER
  ========================= -->

  <footer>

    <strong>Qalb-e-Deen</strong>
    — The Heart of Deen

    <br><br>

    Learn. Reflect. Share.

  </footer>


  <!-- =========================
       FIREBASE
  ========================= -->

  <script type="module">

    import {
      initializeApp
    } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


    import {
      getFirestore,
      collection,
      getDocs,
      query,
      orderBy
    } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    // =====================================
    // FIREBASE CONFIG
    // =====================================

    const firebaseConfig = {

      apiKey:
        "AIzaSyC4sRpUYVLURCkbAbfvUccL5n71Dveiik4",

      authDomain:
        "qalb-e-deen-b765a.firebaseapp.com",

      projectId:
        "qalb-e-deen-b765a",

      storageBucket:
        "qalb-e-deen-b765a.firebasestorage.app",

      messagingSenderId:
        "226972777842",

      appId:
        "1:226972777842:web:0d1439b9d4dc66d8bfb1eb"

    };


    // =====================================
    // INITIALIZE
    // =====================================

    const app =
      initializeApp(firebaseConfig);

    const db =
      getFirestore(app);


    const postsList =
      document.getElementById("postsList");


    // =====================================
    // DATE FORMAT
    // =====================================

    function formatDate(timestamp) {

      if (!timestamp) {
        return "Recently";
      }

      try {

        const date =
          timestamp.toDate();

        return date.toLocaleDateString(
          "en-US",
          {
            year: "numeric",
            month: "long",
            day: "numeric"
          }
        );

      } catch {

        return "Recently";

      }

    }


    // =====================================
    // ESCAPE HTML
    // =====================================

    function escapeHTML(value) {

      if (value === undefined ||
          value === null) {

        return "";

      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    // =====================================
    // LOAD POSTS
    // =====================================

    async function loadPosts() {

      try {

        const postsRef =
          collection(db, "posts");


        /*
          Posts are sorted by createdAt.
          Admin posts should contain createdAt.
        */

        const postsQuery =
          query(
            postsRef,
            orderBy("createdAt", "desc")
          );


        const snapshot =
          await getDocs(postsQuery);


        postsList.innerHTML = "";


        if (snapshot.empty) {

          postsList.innerHTML = `

            <div class="state">

              <h3 style="margin-bottom:10px;">
                No Posts Yet
              </h3>

              <p>
                New Islamic posts will appear here soon.
              </p>

            </div>

          `;

          return;

        }


        snapshot.forEach((docSnapshot) => {

          const post =
            docSnapshot.data();


          const postId =
            docSnapshot.id;


          const title =
            post.title ||
            "Untitled Post";


          const content =
            post.content ||
            post.excerpt ||
            "No content available.";


          const category =
            post.category ||
            "Islamic Reminder";


          const author =
            post.authorName ||
            post.author ||
            "Qalb-e-Deen";


          const imageURL =
            post.imageURL ||
            post.imageUrl ||
            "";


          const createdAt =
            formatDate(post.createdAt);


          const card =
            document.createElement("article");


          card.className =
            "post-card";


          card.innerHTML = `

            ${
              imageURL
              ?
              `
              <img
                class="post-image"
                src="${escapeHTML(imageURL)}"
                alt="${escapeHTML(title)}"
                onerror="this.style.display='none'"
              >
              `
              :
              ""
            }


            <div class="post-content">

              <span class="post-category">
                ${escapeHTML(category)}
              </span>


              <h2 class="post-title">
                ${escapeHTML(title)}
              </h2>


              <p class="post-excerpt">
                ${escapeHTML(content)}
              </p>


              <div class="post-meta">

                <span>
                  By ${escapeHTML(author)}
                </span>

                <span>
                  ${escapeHTML(createdAt)}
                </span>

              </div>


              <a
                class="read-btn"
                href="post.html?id=${encodeURIComponent(postId)}"
              >
                Read More →
              </a>

            </div>

          `;


          postsList.appendChild(card);

        });


      } catch (error) {

        console.error(
          "POST LOAD ERROR:",
          error
        );


        postsList.innerHTML = `

          <div class="error-box">

            <strong>
              Posts could not be loaded.
            </strong>

            <br><br>

            ${escapeHTML(error.message)}

          </div>

        `;

      }

    }


    // =====================================
    // START
    // =====================================

    loadPosts();

  </script>

</body>
        </html>
