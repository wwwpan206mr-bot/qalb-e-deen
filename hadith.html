<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>আজকের হাদিস — Qalb-e-Deen</title>

  <meta
    name="description"
    content="Qalb-e-Deen — আজকের হাদিস, বাংলা অর্থ, উচ্চারণ, ব্যাখ্যা ও শিক্ষা।"
  >

  <meta name="theme-color" content="#0f766e">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        "Noto Sans Bengali",
        "Noto Sans",
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #f0fdfa,
          #f8fafc,
          #ecfeff
        );

      color: #172033;
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;

      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(14px);

      border-bottom: 1px solid #e5e7eb;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      padding: 14px 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      text-decoration: none;
      color: #0f172a;
    }

    .brand-icon {
      width: 44px;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          #0f766e,
          #14b8a6
        );

      color: white;
      font-size: 22px;

      box-shadow:
        0 8px 20px rgba(15,118,110,0.22);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
    }

    .brand-subtitle {
      font-size: 11px;
      color: #64748b;
      margin-top: 2px;
    }

    .back-btn {
      border: none;
      background: #f1f5f9;
      color: #0f766e;

      padding: 9px 14px;
      border-radius: 12px;

      font-weight: 700;
    }

    .back-btn:hover {
      background: #ccfbf1;
    }

    .container {
      max-width: 1050px;
      margin: auto;
      padding: 30px 16px 60px;
    }

    .page-heading {
      text-align: center;
      margin-bottom: 25px;
    }

    .page-heading .icon {
      font-size: 38px;
      margin-bottom: 5px;
    }

    .page-heading h1 {
      font-size: 30px;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .page-heading p {
      color: #64748b;
      font-size: 14px;
    }

    .featured {
      position: relative;
      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          #064e3b,
          #0f766e,
          #115e59
        );

      color: white;

      border-radius: 28px;
      padding: 28px;

      box-shadow:
        0 20px 50px rgba(15,118,110,0.20);

      margin-bottom: 28px;
    }

    .featured::before {
      content: "﷽";

      position: absolute;
      right: -10px;
      top: -25px;

      font-size: 130px;
      opacity: 0.07;
    }

    .featured-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.18);

      padding: 7px 12px;
      border-radius: 30px;

      font-size: 13px;
      font-weight: 700;

      margin-bottom: 18px;
    }

    .hadith-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .arabic {
      direction: rtl;
      text-align: right;

      font-family:
        "Amiri",
        "Noto Naskh Arabic",
        serif;

      font-size: 28px;
      line-height: 2;

      padding: 20px;

      border-radius: 18px;

      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);

      margin-bottom: 18px;
    }

    .info-box {
      margin-top: 14px;
      padding: 17px 18px;

      background: rgba(255,255,255,0.08);

      border: 1px solid rgba(255,255,255,0.12);

      border-radius: 17px;
    }

    .info-label {
      font-size: 12px;
      font-weight: 800;

      color: #99f6e4;

      margin-bottom: 7px;

      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .info-text {
      font-size: 15px;
      line-height: 1.8;
      white-space: pre-line;
    }

    .source {
      margin-top: 20px;

      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;

      gap: 12px;

      font-size: 13px;

      color: #ccfbf1;
    }

    .actions {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    .action-btn {
      border: none;

      padding: 10px 15px;

      border-radius: 12px;

      background: rgba(255,255,255,0.14);
      color: white;

      font-weight: 700;

      border: 1px solid rgba(255,255,255,0.12);
    }

    .action-btn:hover {
      background: rgba(255,255,255,0.23);
    }

    .section {
      background: rgba(255,255,255,0.86);

      border: 1px solid #e2e8f0;

      border-radius: 24px;

      padding: 22px;

      margin-top: 25px;

      box-shadow:
        0 10px 35px rgba(15,23,42,0.05);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      margin-bottom: 18px;
    }

    .section-head h2 {
      font-size: 21px;
      color: #0f172a;
    }

    .count {
      background: #ccfbf1;
      color: #0f766e;

      padding: 6px 10px;
      border-radius: 20px;

      font-size: 12px;
      font-weight: 800;
    }

    .search-box {
      position: relative;
      margin-bottom: 18px;
    }

    .search-box input {
      width: 100%;

      padding: 14px 17px 14px 45px;

      border: 1px solid #dbe3ea;
      border-radius: 15px;

      outline: none;

      background: white;

      color: #0f172a;
    }

    .search-box input:focus {
      border-color: #14b8a6;

      box-shadow:
        0 0 0 4px rgba(20,184,166,0.10);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;

      transform: translateY(-50%);

      color: #64748b;
    }

    .hadith-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);

      gap: 15px;
    }

    .hadith-card {
      background: white;

      border: 1px solid #e2e8f0;

      border-radius: 19px;

      padding: 18px;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease;
    }

    .hadith-card:hover {
      transform: translateY(-3px);

      border-color: #99f6e4;

      box-shadow:
        0 12px 30px rgba(15,118,110,0.09);
    }

    .card-number {
      color: #0f766e;

      font-size: 12px;
      font-weight: 800;

      margin-bottom: 8px;
    }

    .card-title {
      font-size: 17px;
      font-weight: 800;

      margin-bottom: 9px;
    }

    .card-preview {
      color: #64748b;

      font-size: 14px;
      line-height: 1.7;

      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;

      overflow: hidden;

      margin-bottom: 14px;
    }

    .view-btn {
      width: 100%;

      border: none;

      background: #f0fdfa;
      color: #0f766e;

      padding: 10px;

      border-radius: 12px;

      font-weight: 800;
    }

    .view-btn:hover {
      background: #ccfbf1;
    }

    .empty {
      text-align: center;

      padding: 35px 15px;

      color: #64748b;
    }

    .empty-icon {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .loading {
      text-align: center;
      padding: 35px;
      color: #64748b;
    }

    .spinner {
      width: 35px;
      height: 35px;

      border: 4px solid #ccfbf1;
      border-top-color: #0f766e;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;

      margin: 0 auto 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .toast {
      position: fixed;

      left: 50%;
      bottom: 25px;

      transform:
        translateX(-50%)
        translateY(20px);

      background: #0f172a;
      color: white;

      padding: 12px 18px;

      border-radius: 13px;

      font-size: 14px;
      font-weight: 700;

      opacity: 0;

      pointer-events: none;

      transition: all 0.25s ease;

      z-index: 999;
    }

    .toast.show {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }

    footer {
      text-align: center;

      padding: 30px 15px;

      color: #64748b;

      font-size: 13px;
    }

    @media (max-width: 700px) {

      .container {
        padding: 22px 12px 45px;
      }

      .page-heading h1 {
        font-size: 25px;
      }

      .featured {
        padding: 20px;

        border-radius: 22px;
      }

      .hadith-title {
        font-size: 19px;
      }

      .arabic {
        font-size: 23px;
        padding: 15px;
        line-height: 1.9;
      }

      .hadith-list {
        grid-template-columns: 1fr;
      }

      .section {
        padding: 17px;
        border-radius: 20px;
      }

      .header-inner {
        padding: 11px 13px;
      }

      .brand-title {
        font-size: 16px;
      }

      .brand-subtitle {
        display: none;
      }

      .back-btn {
        padding: 8px 11px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="header-inner">

    <a href="index.html" class="brand">

      <div class="brand-icon">
        ☪
      </div>

      <div>
        <div class="brand-title">
          Qalb-e-Deen
        </div>

        <div class="brand-subtitle">
          The Heart of Deen
        </div>
      </div>

    </a>

    <button
      class="back-btn"
      onclick="window.location.href='index.html'"
    >
      ← Home
    </button>

  </div>
</header>


<main class="container">

  <div class="page-heading">

    <div class="icon">
      📖
    </div>

    <h1>
      আজকের হাদিস
    </h1>

    <p>
      প্রতিদিন একটি হাদিস — জানুন, বুঝুন এবং জীবনে আমল করুন।
    </p>

  </div>


  <!-- TODAY'S HADITH -->

  <section class="featured">

    <div class="featured-label">
      ✨ আজকের হাদিস
    </div>

    <div id="todayHadith">

      <div class="loading">

        <div class="spinner"></div>

        হাদিস লোড হচ্ছে...

      </div>

    </div>

  </section>


  <!-- ALL HADITH -->

  <section class="section">

    <div class="section-head">

      <h2>
        📚 সকল হাদিস
      </h2>

      <div
        class="count"
        id="hadithCount"
      >
        0 Hadith
      </div>

    </div>


    <div class="search-box">

      <span class="search-icon">
        🔎
      </span>

      <input
        type="search"
        id="searchInput"
        placeholder="হাদিস খুঁজুন..."
        autocomplete="off"
      >

    </div>


    <div
      id="hadithList"
      class="hadith-list"
    >

      <div class="loading">

        <div class="spinner"></div>

        সকল হাদিস লোড হচ্ছে...

      </div>

    </div>

  </section>

</main>


<footer>

  <div>
    © <span id="year"></span> Qalb-e-Deen
  </div>

  <div style="margin-top:5px;">
    The Heart of Deen
  </div>

</footer>


<div
  id="toast"
  class="toast"
></div>


<script type="module">

  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


  import {
    getFirestore,
    collection,
    getDocs,
    query,
    where
  } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  /*
  ============================================
  FIREBASE CONFIG
  ============================================
  */

  const firebaseConfig = {

    apiKey:
      "AIzaSyC4sRpUYVLURCkbAbfvUccL5n71Dveiik4",

    authDomain:
      "qalb-e-deen-b765a.firebaseapp.com",

    projectId:
      "qalb-e-deen-b765a",

    storageBucket:
      "qalb-e-deen-b765a.firebasestorage.app",

    messagingSenderId:
      "226972777842",

    appId:
      "1:226972777842:web:0d1439b9d4dc66d8bfb1eb"

  };


  const app =
    initializeApp(firebaseConfig);

  const db =
    getFirestore(app);


  /*
  ============================================
  GLOBAL DATA
  ============================================
  */

  let allHadiths = [];

  let currentHadith = null;


  /*
  ============================================
  DOM
  ============================================
  */

  const todayHadith =
    document.getElementById("todayHadith");

  const hadithList =
    document.getElementById("hadithList");

  const hadithCount =
    document.getElementById("hadithCount");

  const searchInput =
    document.getElementById("searchInput");


  document.getElementById("year").textContent =
    new Date().getFullYear();


  /*
  ============================================
  ESCAPE HTML
  ============================================
  */

  function escapeHtml(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /*
  ============================================
  DHAKA DATE
  ============================================
  */

  function getDhakaDateKey() {

    try {

      return new Intl.DateTimeFormat(
        "en-CA",
        {
          timeZone: "Asia/Dhaka",
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }
      ).format(new Date());

    } catch (error) {

      return new Date()
        .toISOString()
        .slice(0, 10);

    }

  }


  /*
  ============================================
  DAY OF YEAR
  ============================================
  */

  function getDayOfYear() {

    const dateKey =
      getDhakaDateKey();

    const parts =
      dateKey.split("-").map(Number);

    const year =
      parts[0];

    const month =
      parts[1];

    const day =
      parts[2];

    const start =
      Date.UTC(year, 0, 1);

    const current =
      Date.UTC(
        year,
        month - 1,
        day
      );

    return Math.floor(
      (current - start) / 86400000
    );

  }


  /*
  ============================================
  SORT HADITHS
  ============================================
  */

  function sortHadiths(list) {

    return list.sort((a, b) => {

      const aTime =
        a.createdAt?.seconds || 0;

      const bTime =
        b.createdAt?.seconds || 0;

      if (aTime !== bTime) {
        return aTime - bTime;
      }

      return String(a.title || "")
        .localeCompare(
          String(b.title || ""),
          "bn"
        );

    });

  }


  /*
  ============================================
  LOAD HADITHS
  ============================================
  */

  async function loadHadiths() {

    try {

      todayHadith.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          হাদিস লোড হচ্ছে...
        </div>
      `;

      hadithList.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          সকল হাদিস লোড হচ্ছে...
        </div>
      `;


      const hadithQuery =
        query(
          collection(db, "hadiths"),
          where("active", "==", true)
        );


      const snapshot =
        await getDocs(hadithQuery);


      allHadiths = [];


      snapshot.forEach((docSnap) => {

        allHadiths.push({

          id: docSnap.id,

          ...docSnap.data()

        });

      });


      allHadiths =
        sortHadiths(allHadiths);


      hadithCount.textContent =
        `${allHadiths.length} Hadith`;


      if (allHadiths.length === 0) {

        showEmpty();

        return;

      }


      /*
      ========================================
      URL HADITH SUPPORT
      Example:
      hadith.html?hadith=DOCUMENT_ID
      ========================================
      */

      const params =
        new URLSearchParams(
          window.location.search
        );

      const requestedId =
        params.get("hadith");


      if (requestedId) {

        const requestedHadith =
          allHadiths.find(
            item => item.id === requestedId
          );


        if (requestedHadith) {

          renderTodayHadith(
            requestedHadith
          );

        } else {

          renderDailyHadith();

        }

      } else {

        renderDailyHadith();

      }


      renderHadithList(
        allHadiths
      );


    } catch (error) {

      console.error(
        "Hadith loading error:",
        error
      );


      todayHadith.innerHTML = `
        <div class="empty">
          <div class="empty-icon">⚠️</div>

          <strong>
            হাদিস লোড করা যায়নি
          </strong>

          <p style="margin-top:8px;">
            Firebase connection বা Firestore rules
            পরীক্ষা করুন।
          </p>
        </div>
      `;


      hadithList.innerHTML = `
        <div class="empty">

          <div class="empty-icon">
            ⚠️
          </div>

          হাদিস লোড করা যায়নি।

        </div>
      `;

    }

  }


  /*
  ============================================
  DAILY HADITH
  ============================================
  */

  function renderDailyHadith() {

    if (!allHadiths.length) {
      showEmpty();
      return;
    }


    const day =
      getDayOfYear();


    const index =
      day % allHadiths.length;


    const hadith =
      allHadiths[index];


    renderTodayHadith(
      hadith
    );

  }


  /*
  ============================================
  RENDER TODAY HADITH
  ============================================
  */

  function renderTodayHadith(hadith) {

    currentHadith =
      hadith;


    const title =
      hadith.title ||
      "আজকের হাদিস";


    const arabic =
      hadith.arabic ||
      "আরবি হাদিস দেওয়া হয়নি।";


    const transliteration =
      hadith.transliteration ||
      "বাংলা উচ্চারণ দেওয়া হয়নি।";


    const englishPronunciation =
      hadith.englishPronunciation ||
      "English pronunciation is not available.";


    const translation =
      hadith.translation ||
      "বাংলা অর্থ দেওয়া হয়নি।";


    const explanation =
      hadith.explanation ||
      "এই হাদিসের বিস্তারিত ব্যাখ্যা এখনো যোগ করা হয়নি।";


    const lesson =
      hadith.lesson ||
      "মূল শিক্ষা এখনো যোগ করা হয়নি।";


    const source =
      hadith.source ||
      "উৎস উল্লেখ করা হয়নি।";


    const number =
      hadith.hadithNumber ||
      "";


    todayHadith.innerHTML = `

      <div class="hadith-title">
        ${escapeHtml(title)}
      </div>


      <div class="arabic">
        ${escapeHtml(arabic)}
      </div>


      <div class="info-box">

        <div class="info-label">
          বাংলা উচ্চারণ
        </div>

        <div class="info-text">
          ${escapeHtml(transliteration)}
        </div>

      </div>


      <div class="info-box">

        <div class="info-label">
          English Pronunciation
        </div>

        <div class="info-text">
          ${escapeHtml(
            englishPronunciation
          )}
        </div>

      </div>


      <div class="info-box">

        <div class="info-label">
          বাংলা অর্থ
        </div>

        <div class="info-text">
          ${escapeHtml(translation)}
        </div>

      </div>


      <div class="info-box">

        <div class="info-label">
          হাদিসের ব্যাখ্যা
        </div>

        <div class="info-text">
          ${escapeHtml(explanation)}
        </div>

      </div>


      <div class="info-box">

        <div class="info-label">
          মূল শিক্ষা
        </div>

        <div class="info-text">
          ${escapeHtml(lesson)}
        </div>

      </div>


      <div class="source">

        <div>
          📚 ${escapeHtml(source)}
          ${number
            ? ` • হাদিস নং: ${escapeHtml(number)}`
            : ""
          }
        </div>


        <div class="actions">

          <button
            class="action-btn"
            id="copyBtn"
          >
            📋 Copy
          </button>


          <button
            class="action-btn"
            id="shareBtn"
          >
            🔗 Share
          </button>

        </div>

      </div>

    `;


    document
      .getElementById("copyBtn")
      .addEventListener(
        "click",
        copyHadith
      );


    document
      .getElementById("shareBtn")
      .addEventListener(
        "click",
        shareHadith
      );

  }


  /*
  ============================================
  HADITH TEXT FOR COPY / SHARE
  ============================================
  */

  function getHadithText(hadith) {

    return `
${hadith.title || "হাদিস"}

আরবি:
${hadith.arabic || ""}

বাংলা উচ্চারণ:
${hadith.transliteration || ""}

English Pronunciation:
${hadith.englishPronunciation || ""}

বাংলা অর্থ:
${hadith.translation || ""}

ব্যাখ্যা:
${hadith.explanation || ""}

মূল শিক্ষা:
${hadith.lesson || ""}

উৎস:
${hadith.source || ""}

${hadith.hadithNumber
  ? "হাদিস নম্বর: " + hadith.hadithNumber
  : ""
}

— Qalb-e-Deen
The Heart of Deen
    `.trim();

  }


  /*
  ============================================
  COPY
  ============================================
  */

  async function copyHadith() {

    if (!currentHadith) {
      return;
    }


    const text =
      getHadithText(
        currentHadith
      );


    try {

      await navigator.clipboard.writeText(
        text
      );

      showToast(
        "হাদিস কপি হয়েছে ✓"
      );

    } catch (error) {

      showToast(
        "Copy করা যায়নি"
      );

    }

  }


  /*
  ============================================
  SHARE
  ============================================
  */

  async function shareHadith() {

    if (!currentHadith) {
      return;
    }


    const shareUrl =
      `${window.location.origin}${window.location.pathname}?hadith=${currentHadith.id}`;


    const shareData = {

      title:
        currentHadith.title ||
        "আজকের হাদিস",

      text:
        getHadithText(
          currentHadith
        ),

      url:
        shareUrl

    };


    try {

      if (
        navigator.share
      ) {

        await navigator.share(
          shareData
        );

      } else {

        await navigator.clipboard.writeText(
          shareUrl
        );

        showToast(
          "হাদিসের লিংক কপি হয়েছে ✓"
        );

      }

    } catch (error) {

      console.log(
        "Share cancelled"
      );

    }

  }


  /*
  ============================================
  RENDER ALL HADITHS
  ============================================
  */

  function renderHadithList(list) {

    if (!list.length) {

      hadithList.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            🔍
          </div>

          <strong>
            কোনো হাদিস পাওয়া যায়নি
          </strong>

          <p style="margin-top:7px;">
            অন্য কোনো শব্দ দিয়ে খুঁজে দেখুন।
          </p>

        </div>

      `;

      return;

    }


    hadithList.innerHTML =
      list.map(
        (hadith, index) => {

          const title =
            hadith.title ||
            "হাদিস";


          const preview =
            hadith.translation ||
            hadith.explanation ||
            hadith.arabic ||
            "";


          const number =
            hadith.hadithNumber ||
            (index + 1);


          return `

            <article
              class="hadith-card"
            >

              <div class="card-number">
                Hadith #${escapeHtml(number)}
              </div>


              <div class="card-title">
                ${escapeHtml(title)}
              </div>


              <div class="card-preview">
                ${escapeHtml(preview)}
              </div>


              <button
                class="view-btn"
                data-id="${escapeHtml(hadith.id)}"
              >
                📖 সম্পূর্ণ হাদিস দেখুন
              </button>

            </article>

          `;

        }
      ).join("");


    document
      .querySelectorAll(".view-btn")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            const id =
              button.dataset.id;


            const hadith =
              allHadiths.find(
                item => item.id === id
              );


            if (hadith) {

              renderTodayHadith(
                hadith
              );


              window.scrollTo({
                top: 0,
                behavior: "smooth"
              });


              const newUrl =
                `${window.location.pathname}?hadith=${encodeURIComponent(id)}`;


              history.replaceState(
                null,
                "",
                newUrl
              );

            }

          }
        );

      });

  }


  /*
  ============================================
  SEARCH
  ============================================
  */

  searchInput.addEventListener(
    "input",
    () => {

      const keyword =
        searchInput.value
          .trim()
          .toLowerCase();


      if (!keyword) {

        renderHadithList(
          allHadiths
        );

        return;

      }


      const filtered =
        allHadiths.filter(
          hadith => {

            const searchable = [

              hadith.title,
              hadith.arabic,
              hadith.transliteration,
              hadith.englishPronunciation,
              hadith.translation,
              hadith.explanation,
              hadith.lesson,
              hadith.source,
              hadith.hadithNumber

            ]
              .filter(Boolean)
              .join(" ")
              .toLowerCase();


            return searchable.includes(
              keyword
            );

          }
        );


      renderHadithList(
        filtered
      );

    }
  );


  /*
  ============================================
  EMPTY
  ============================================
  */

  function showEmpty() {

    todayHadith.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          📖
        </div>

        <strong>
          এখনো কোনো Active Hadith নেই
        </strong>

        <p style="margin-top:8px;">
          Admin Panel থেকে Hadith যোগ করে
          Active করুন।
        </p>

      </div>

    `;


    hadithList.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          📚
        </div>

        এখনো কোনো Active Hadith নেই।

      </div>

    `;

  }


  /*
  ============================================
  TOAST
  ============================================
  */

  let toastTimer;


  function showToast(message) {

    const toast =
      document.getElementById("toast");


    toast.textContent =
      message;


    toast.classList.add(
      "show"
    );


    clearTimeout(
      toastTimer
    );


    toastTimer =
      setTimeout(
        () => {

          toast.classList.remove(
            "show"
          );

        },
        2500
      );

  }


  /*
  ============================================
  AUTO REFRESH AT NEW DAY
  ============================================
  */

  let lastDate =
    getDhakaDateKey();


  setInterval(
    () => {

      const newDate =
        getDhakaDateKey();


      if (
        newDate !== lastDate
      ) {

        lastDate =
          newDate;


        renderDailyHadith();

        showToast(
          "নতুন দিনের আজকের হাদিস আপডেট হয়েছে ✓"
        );

      }

    },
    60000
  );


  /*
  ============================================
  START
  ============================================
  */

  loadHadiths();

</script>
