<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel — Qalb-e-Deen</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:#f4f7f6;
  color:#17211f;
}

header{
  background:#0d2b24;
  color:white;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:22px;
  font-weight:700;
}

.logo span{
  color:#d7b56d;
}

.logout{
  background:#c94b4b;
  border:0;
  color:white;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.container{
  max-width:1150px;
  margin:auto;
  padding:25px 16px 50px;
}

.welcome{
  margin-bottom:25px;
}

.welcome h1{
  font-size:30px;
  margin-bottom:6px;
}

.welcome p{
  color:#697570;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:white;
  padding:22px;
  border-radius:14px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.stat small{
  color:#777;
}

.stat h2{
  margin-top:8px;
  font-size:30px;
  color:#0d5b48;
}

.card{
  background:white;
  padding:25px;
  border-radius:16px;
  margin-bottom:25px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.card h2{
  margin-bottom:20px;
}

label{
  display:block;
  font-weight:bold;
  margin:14px 0 7px;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  border:1px solid #d9dfdc;
  border-radius:9px;
  font-size:15px;
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#0d765c;
}

textarea{
  min-height:220px;
  resize:vertical;
}

.publish{
  margin-top:18px;
  background:#0d5b48;
  color:white;
  border:0;
  padding:14px 22px;
  border-radius:9px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.publish:hover{
  background:#094838;
}

.message{
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  display:none;
}

.posts{
  display:grid;
  gap:15px;
}

.post{
  border:1px solid #e3e7e5;
  border-radius:12px;
  padding:17px;
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
}

.post-info{
  flex:1;
}

.post-info h3{
  margin-bottom:7px;
}

.post-meta{
  color:#777;
  font-size:13px;
}

.delete{
  background:#d94b4b;
  color:white;
  border:0;
  padding:9px 13px;
  border-radius:7px;
  cursor:pointer;
}

.empty{
  text-align:center;
  color:#777;
  padding:20px;
}

.loading{
  text-align:center;
  padding:25px;
}

.access{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

.access-box{
  background:white;
  padding:35px;
  border-radius:16px;
  box-shadow:0 5px 25px rgba(0,0,0,.1);
}

.access-box h2{
  color:#c0392b;
  margin-bottom:10px;
}

@media(max-width:700px){
  .stats{
    grid-template-columns:1fr;
  }

  .post{
    flex-direction:column;
    align-items:flex-start;
  }

  .delete{
    width:100%;
  }

  .welcome h1{
    font-size:25px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    Qalb<span>-e-Deen</span>
  </div>

  <button class="logout" id="logoutBtn">
    Logout
  </button>
</header>

<div class="container">

  <div class="welcome">
    <h1>Admin Dashboard</h1>
    <p id="adminEmail">Checking administrator account...</p>
  </div>

  <div class="stats">

    <div class="stat">
      <small>Total Posts</small>
      <h2 id="totalPosts">0</h2>
    </div>

    <div class="stat">
      <small>Admin</small>
      <h2>1</h2>
    </div>

    <div class="stat">
      <small>Status</small>
      <h2>Active</h2>
    </div>

  </div>

  <div class="card">

    <h2>✍️ Create New Post</h2>

    <form id="postForm">

      <label>Post Title</label>
      <input
        type="text"
        id="title"
        placeholder="Enter post title"
        required
      >

      <label>Category</label>

      <select id="category" required>
