
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>আজকের হাদিস — Qalb-e-Deen</title>
<meta name="description" content="আজকের হাদিস, বাংলা উচ্চারণ, অর্থ, ব্যাখ্যা ও শিক্ষা।">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./logo.png" type="image/png">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans Bengali","Noto Sans",Arial,sans-serif;background:linear-gradient(135deg,#f0fdfa,#f8fafc,#ecfeff);color:#172033;min-height:100vh}
button,input{font:inherit}button{cursor:pointer}
.header{position:sticky;top:0;z-index:10;background:#ffffffed;backdrop-filter:blur(12px);border-bottom:1px solid #e5e7eb}
.header-inner{max-width:1100px;margin:auto;padding:13px 17px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#0f172a}
.brand-icon{width:43px;height:43px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#0f766e,#14b8a6);color:white;font-size:22px}
.brand-title{font-size:18px;font-weight:800}.brand-subtitle{font-size:11px;color:#64748b}
.back-btn{border:0;background:#f1f5f9;color:#0f766e;padding:9px 13px;border-radius:11px;font-weight:700}
.container{max-width:1050px;margin:auto;padding:28px 15px 50px}
.page-heading{text-align:center;margin-bottom:24px}
.page-heading .icon{font-size:38px;margin-bottom:5px}
.page-heading h1{font-size:clamp(25px,5vw,31px);margin-bottom:7px}
.page-heading p{color:#64748b;font-size:14px;line-height:1.8}
.featured{position:relative;overflow:hidden;background:linear-gradient(135deg,#064e3b,#0f766e,#115e59);color:white;border-radius:25px;padding:clamp(17px,4vw,28px);box-shadow:0 15px 40px #0f766e20;margin-bottom:25px}
.featured-label{display:inline-flex;gap:7px;align-items:center;background:#ffffff20;border:1px solid #ffffff30;padding:7px 12px;border-radius:30px;font-size:13px;font-weight:700;margin-bottom:17px}
.hour-status{font-size:12px;color:#ccfbf1;margin:0 0 18px;line-height:1.8}
.hadith-title{font-size:22px;font-weight:800;margin-bottom:17px;line-height:1.6}
.arabic{direction:rtl;text-align:right;font-family:"Amiri","Noto Naskh Arabic",serif;font-size:clamp(23px,4vw,30px);line-height:2;padding:17px;border-radius:17px;background:#ffffff12;border:1px solid #ffffff20;margin-bottom:15px}
.info-box{margin-top:13px;padding:15px 16px;background:#ffffff10;border:1px solid #ffffff20;border-radius:15px}
.info-label{font-size:12px;font-weight:800;color:#99f6e4;margin-bottom:7px}
.info-text{font-size:15px;line-height:1.9;white-space:pre-line;overflow-wrap:anywhere}
.source{margin-top:18px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:#ccfbf1}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.action-btn{border:1px solid #ffffff25;padding:9px 13px;border-radius:11px;background:#ffffff18;color:white;font-weight:700}
.action-btn:hover{background:#ffffff30}
.section{background:#ffffffdf;border:1px solid #e2e8f0;border-radius:22px;padding:20px;margin-top:24px;box-shadow:0 10px 30px #0f172a08}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}
.section-head h2{font-size:20px}
.count{background:#ccfbf1;color:#0f766e;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:800;white-space:nowrap}
.search-box{margin-bottom:17px}
.search-box input{width:100%;padding:13px 15px;border:1px solid #dbe3ea;border-radius:13px;outline:none;background:white}
.search-box input:focus{border-color:#14b8a6;box-shadow:0 0 0 3px #14b8a618}
.hadith-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.hadith-card{background:white;border:1px solid #e2e8f0;border-radius:17px;padding:16px;min-width:0}
.card-number{color:#0f766e;font-size:12px;font-weight:800;margin-bottom:7px}
.card-title{font-size:16px;font-weight:800;margin-bottom:8px;line-height:1.6}
.card-preview{color:#64748b;font-size:14px;line-height:1.8;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:13px}
.view-btn{width:100%;border:0;background:#f0fdfa;color:#0f766e;padding:10px;border-radius:11px;font-weight:800}
.view-btn:hover{background:#ccfbf1}
.loading,.empty{text-align:center;padding:30px 12px;color:#64748b;line-height:1.8}
.spinner{width:32px;height:32px;border:4px solid #ccfbf1;border-top-color:#0f766e;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#0f172a;color:white;padding:12px 17px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;padding:25px 12px;color:#64748b;font-size:13px;line-height:1.9}
@media(max-width:700px){.container{padding:22px 12px 40px}.featured{border-radius:21px}.hadith-list{grid-template-columns:1fr}.section{padding:15px;border-radius:19px}.brand-title{font-size:16px}.brand-subtitle{display:none}.back-btn{font-size:12px;padding:8px 10px}.hadith-title{font-size:19px}.info-text{font-size:14px}}
</style>
</head>

<body>
<header class="header">
  <div class="header-inner">
    <a href="./index.html" class="brand">
      <div class="brand-icon">☪</div>
      <div>
        <div class="brand-title">Qalb-e-Deen</div>
        <div class="brand-subtitle">The Heart of Deen</div>
      </div>
    </a>
    <button class="back-btn" onclick="location.href='./index.html'">← Home</button>
  </div>
</header>

<main class="container">
  <div class="page-heading">
    <div class="icon">📖</div>
    <h1>আজকের হাদিস</h1>
    <p>প্রতি ঘণ্টায় নতুন হাদিস পড়ুন, বুঝুন এবং জীবনে আমল করুন।</p>
  </div>

  <section class="featured">
    <div class="featured-label">✨ ঘণ্টার হাদিস</div>
    <div id="todayHadith">
      <div class="loading"><div class="spinner"></div>হাদিস লোড হচ্ছে...</div>
    </div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>📚 সকল হাদিস</h2>
      <span class="count" id="hadithCount">লোড হচ্ছে</span>
    </div>
    <div class="search-box">
      <input type="search" id="searchInput" placeholder="শিরোনাম, আরবি, অনুবাদ বা ব্যাখ্যা দিয়ে খুঁজুন..." autocomplete="off">
    </div>
    <div id="hadithList" class="hadith-list">
      <div class="loading"><div class="spinner"></div>সকল হাদিস লোড হচ্ছে...</div>
    </div>
  </section>
</main>

<footer>
  <div>© <span id="year"></span> Qalb-e-Deen</div>
  <div>The Heart of Deen</div>
</footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC4sRpUYVLURCkbAbfvUcc5Ln71Dveiik4",
  authDomain: "qalb-e-deen-b765a.firebaseapp.com",
  projectId: "qalb-e-deen-b765a",
  storageBucket: "qalb-e-deen-b765a.firebasestorage.app",
  messagingSenderId: "226972777842",
  appId: "1:983132945914:web:0d1439b9d4dc66d8bfb1eb".replace("1:983132945914:web:c4cd95d50a5259cbbdf843","1:226972777842:web:0d1439b9d4dc66d8bfb1eb")
};

const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const db = getFirestore(app);

let allHadiths = [];
let currentHadith = null;
let lastHourKey = "";
let toastTimer;

const todayHadith = document.getElementById("todayHadith");
const hadithList = document.getElementById("hadithList");
const hadithCount = document.getElementById("hadithCount");
const searchInput = document.getElementById("searchInput");

document.getElementById("year").textContent = new Date().getFullYear();

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function getDhakaParts() {
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Asia/Dhaka",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    hourCycle: "h23"
  }).formatToParts(new Date());

  return Object.fromEntries(parts.filter(p => p.type !== "literal").map(p => [p.type, p.value]));
}

function getDhakaHourKey() {
  const p = getDhakaParts();
  return `${p.year}-${p.month}-${p.day}-${p.hour}`;
}

function getDhakaHourIndex() {
  const p = getDhakaParts();
  const start = Date.UTC(Number(p.year), 0, 1);
  const today = Date.UTC(Number(p.year), Number(p.month) - 1, Number(p.day));
  const dayOfYear = Math.floor((today - start) / 86400000);
  return dayOfYear * 24 + Number(p.hour);
}

function sortHadiths(list) {
  return list.sort((a, b) => {
    const aTime = a.createdAt?.seconds || 0;
    const bTime = b.createdAt?.seconds || 0;
    if (aTime !== bTime) return aTime - bTime;
    return String(a.title || "").localeCompare(String(b.title || ""), "bn");
  });
}

function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
}

function showError(message) {
  todayHadith.innerHTML = `<div class="empty"><div style="font-size:34px">⚠️</div><strong>${escapeHtml(message)}</strong><p style="margin-top:8px">Firebase connection, hadiths collection এবং Firestore rules পরীক্ষা করুন।</p></div>`;
  hadithList.innerHTML = `<div class="empty">হাদিসের তালিকা লোড করা যায়নি।</div>`;
}

function showEmpty() {
  todayHadith.innerHTML = `<div class="empty"><div style="font-size:35px">📖</div><strong>এখনো কোনো Active Hadith নেই</strong><p style="margin-top:8px">Admin Panel থেকে একাধিক হাদিস যোগ করে Active করুন।</p></div>`;
  hadithList.innerHTML = `<div class="empty">এখনো কোনো Active Hadith নেই।</div>`;
}

async function loadHadiths() {
  try {
    const q = query(collection(db, "hadiths"), where("active", "==", true));
    const snapshot = await getDocs(q);

    allHadiths = snapshot.docs.map(docSnap => ({
      id: docSnap.id,
      ...docSnap.data()
    }));

    allHadiths = sortHadiths(allHadiths);
    hadithCount.textContent = `${allHadiths.length} Hadith`;

    if (!allHadiths.length) {
      showEmpty();
      return;
    }

    renderHadithList(allHadiths);

    const params = new URLSearchParams(location.search);
    const requestedId = params.get("hadith");
    const requested = requestedId ? allHadiths.find(h => h.id === requestedId) : null;

    // Shared links open their requested hadith first.
    // Hourly rotation takes over at the next Dhaka-hour boundary.
    if (requested) {
      renderHadith(requested);
      lastHourKey = getDhakaHourKey();
    } else {
      renderHourlyHadith(false);
    }
  } catch (error) {
    console.error("Hadith loading error:", error);
    showError("হাদিস লোড করা যায়নি");
  }
}

function renderHourlyHadith(notify = true) {
  if (!allHadiths.length) return;

  const hourKey = getDhakaHourKey();
  const index = getDhakaHourIndex() % allHadiths.length;
  const nextHadith = allHadiths[index];
  const changed = lastHourKey !== "" && lastHourKey !== hourKey;

  lastHourKey = hourKey;
  renderHadith(nextHadith);

  // Keep the address clean when normal hourly rotation is active.
  if (new URLSearchParams(location.search).has("hadith")) {
    history.replaceState(null, "", location.pathname);
  }

  if (notify && changed) {
    showToast("নতুন ঘণ্টার হাদিস আপডেট হয়েছে ✓");
  }
}

function renderHadith(hadith) {
  currentHadith = hadith;

  const title = hadith.title || "হাদিস";
  const arabic = hadith.arabic || "আরবি হাদিস যোগ করা হয়নি।";
  const transliteration = hadith.transliteration || "বাংলা উচ্চারণ যোগ করা হয়নি।";
  const englishPronunciation = hadith.englishPronunciation || "English pronunciation is not available.";
  const translationLanguage = hadith.translationLanguage === "English" ? "English meaning" : "বাংলা অর্থ";
  const translation = hadith.translation || (translationLanguage === "English meaning" ? "English meaning is not available." : "বাংলা অর্থ যোগ করা হয়নি।");
  const explanation = hadith.explanation || "ব্যাখ্যা এখনো যোগ করা হয়নি।";
  const lesson = hadith.lesson || "মূল শিক্ষা এখনো যোগ করা হয়নি।";
  const source = hadith.source || "উৎস উল্লেখ করা হয়নি।";
  const number = hadith.hadithNumber || "";

  todayHadith.innerHTML = `
    <div class="hadith-title">${escapeHtml(title)}</div>
    <div class="hour-status">🕐 বাংলাদেশ সময় অনুযায়ী প্রতি ঘণ্টায় হাদিস পরিবর্তন হয়। মোট Active Hadith: ${allHadiths.length}</div>
    <div class="arabic" dir="rtl" lang="ar">${escapeHtml(arabic)}</div>
    <div class="info-box"><div class="info-label">বাংলা উচ্চারণ</div><div class="info-text">${escapeHtml(transliteration)}</div></div>
    <div class="info-box"><div class="info-label">English Pronunciation</div><div class="info-text">${escapeHtml(englishPronunciation)}</div></div>
    <div class="info-box"><div class="info-label">${escapeHtml(translationLanguage)}</div><div class="info-text">${escapeHtml(translation)}</div></div>
    <div class="info-box"><div class="info-label">হাদিসের ব্যাখ্যা</div><div class="info-text">${escapeHtml(explanation)}</div></div>
    <div class="info-box"><div class="info-label">মূল শিক্ষা</div><div class="info-text">${escapeHtml(lesson)}</div></div>
    <div class="source">
      <div>📚 ${escapeHtml(source)}${number ? ` • হাদিস নং: ${escapeHtml(number)}` : ""}</div>
      <div class="actions">
        <button class="action-btn" id="copyBtn" type="button">📋 Copy</button>
        <button class="action-btn" id="shareBtn" type="button">🔗 Share</button>
      </div>
    </div>`;

  document.getElementById("copyBtn").addEventListener("click", copyHadith);
  document.getElementById("shareBtn").addEventListener("click", shareHadith);
}

function getHadithText(h) {
  return `${h.title || "হাদিস"}

আরবি:
${h.arabic || ""}

বাংলা উচ্চারণ:
${h.transliteration || ""}

English Pronunciation:
${h.englishPronunciation || ""}

${h.translationLanguage === "English" ? "English meaning:" : "বাংলা অর্থ:"}
${h.translation || ""}

ব্যাখ্যা:
${h.explanation || ""}

মূল শিক্ষা:
${h.lesson || ""}

উৎস: ${h.source || ""}
${h.hadithNumber ? "হাদিস নম্বর: " + h.hadithNumber : ""}

— Qalb-e-Deen`;
}

async function copyHadith() {
  if (!currentHadith) return;
  try {
    await navigator.clipboard.writeText(getHadithText(currentHadith));
    showToast("হাদিস কপি হয়েছে ✓");
  } catch {
    showToast("কপি করা যায়নি। ব্রাউজারের clipboard permission পরীক্ষা করুন।");
  }
}

async function shareHadith() {
  if (!currentHadith) return;

  const shareUrl = new URL(location.pathname, location.origin);
  shareUrl.searchParams.set("hadith", currentHadith.id);

  const shareData = {
    title: currentHadith.title || "আজকের হাদিস",
    text: getHadithText(currentHadith),
    url: shareUrl.href
  };

  try {
    if (navigator.share) {
      await navigator.share(shareData);
    } else {
      await navigator.clipboard.writeText(shareUrl.href);
      showToast("হাদিসের লিংক কপি হয়েছে ✓");
    }
  } catch (error) {
    if (error.name !== "AbortError") showToast("শেয়ার করা যায়নি।");
  }
}

function renderHadithList(list) {
  if (!list.length) {
    hadithList.innerHTML = `<div class="empty">🔎<br>কোনো হাদিস পাওয়া যায়নি। অন্য শব্দ দিয়ে খুঁজুন।</div>`;
    return;
  }

  hadithList.innerHTML = list.map((h, index) => {
    const preview = h.translation || h.explanation || h.arabic || "";
    const number = h.hadithNumber || index + 1;

    return `<article class="hadith-card">
      <div class="card-number">Hadith #${escapeHtml(number)}</div>
      <div class="card-title">${escapeHtml(h.title || "হাদিস")}</div>
      <div class="card-preview">${escapeHtml(preview)}</div>
      <button class="view-btn" type="button" data-id="${escapeHtml(h.id)}">📖 সম্পূর্ণ হাদিস দেখুন</button>
    </article>`;
  }).join("");

  hadithList.querySelectorAll(".view-btn").forEach(button => {
    button.addEventListener("click", () => {
      const selected = allHadiths.find(h => h.id === button.dataset.id);
      if (!selected) return;

      renderHadith(selected);
      history.replaceState(null, "", `${location.pathname}?hadith=${encodeURIComponent(selected.id)}`);
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });
}

searchInput.addEventListener("input", () => {
  const keyword = searchInput.value.trim().toLowerCase();

  if (!keyword) {
    renderHadithList(allHadiths);
    return;
  }

  const filtered = allHadiths.filter(h => [
    h.title, h.arabic, h.transliteration,
    h.englishPronunciation, h.translation,
    h.explanation, h.lesson, h.source, h.hadithNumber
  ].filter(Boolean).join(" ").toLowerCase().includes(keyword));

  renderHadithList(filtered);
});

// Check the Bangladesh hour regularly. No page refresh is needed.
setInterval(() => {
  const currentHourKey = getDhakaHourKey();
  if (currentHourKey !== lastHourKey && allHadiths.length) {
    renderHourlyHadith(true);
  }
}, 15000);

// If the visitor returns to the tab after an hour, update immediately.
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && allHadiths.length && getDhakaHourKey() !== lastHourKey) {
    renderHourlyHadith(true);
  }
});

loadHadiths();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(console.warn);
  });
}
</script>
</body>
</html>
