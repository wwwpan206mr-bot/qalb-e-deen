<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel — Qalb-e-Deen</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:#f4f7f6;
  color:#17211f;
}

header{
  background:#0d2b24;
  color:white;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.logo span{
  color:#d7b56d;
}

button{
  cursor:pointer;
}

.logout{
  background:#c94b4b;
  color:white;
  border:0;
  padding:10px 16px;
  border-radius:8px;
  font-weight:bold;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 16px 50px;
}

.welcome{
  margin-bottom:25px;
}

.welcome h1{
  font-size:30px;
  margin-bottom:7px;
}

.welcome p{
  color:#68736f;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:white;
  padding:22px;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.stat small{
  color:#777;
}

.stat h2{
  margin-top:8px;
  color:#0d5b48;
}

.card{
  background:white;
  padding:25px;
  border-radius:16px;
  margin-bottom:25px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.card h2{
  margin-bottom:20px;
}

label{
  display:block;
  margin:14px 0 7px;
  font-weight:bold;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  border:1px solid #d8dfdc;
  border-radius:9px;
  font-size:15px;
}

textarea{
  min-height:220px;
  resize:vertical;
}

.publish{
  margin-top:18px;
  background:#0d5b48;
  color:white;
  border:0;
  padding:14px 22px;
  border-radius:9px;
  font-weight:bold;
  font-size:16px;
}

.publish:disabled{
  opacity:.6;
}

.message{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:8px;
}

.post{
  border:1px solid #e2e7e5;
  padding:16px;
  border-radius:12px;
  margin-bottom:12px;
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
}

.post-info{
  flex:1;
}

.post-info h3{
  margin-bottom:6px;
}

.meta{
  font-size:13px;
  color:#777;
}

.delete{
  background:#d94b4b;
  color:white;
  border:0;
  padding:9px 14px;
  border-radius:7px;
}

.loading{
  text-align:center;
  padding:20px;
  color:#777;
}

.error{
  background:#fff0f0;
  color:#a52828;
  padding:18px;
  border-radius:10px;
  margin-top:20px;
  word-break:break-word;
}

.hidden{
  display:none;
}

@media(max-width:700px){

  .stats{
    grid-template-columns:1fr;
  }

  .post{
    flex-direction:column;
    align-items:flex-start;
  }

  .delete{
    width:100%;
  }

  .welcome h1{
    font-size:25px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    Qalb<span>-e-Deen</span>
  </div>

  <button class="logout" id="logoutBtn">
    Logout
  </button>

</header>


<div class="container">

  <div class="welcome">

    <h1>Admin Dashboard</h1>

    <p id="status">
      Checking administrator account...
    </p>

  </div>


  <!-- ERROR AREA -->

  <div id="errorBox" class="error hidden"></div>


  <!-- DASHBOARD -->

  <div id="dashboard" class="hidden">


    <div class="stats">

      <div class="stat">

        <small>Total Posts</small>

        <h2 id="totalPosts">0</h2>

      </div>


      <div class="stat">

        <small>Administrator</small>

        <h2>Admin</h2>

      </div>


      <div class="stat">

        <small>System</small>

        <h2>Active</h2>

      </div>

    </div>



    <!-- CREATE POST -->

    <div class="card">

      <h2>✍️ Create New Post</h2>

      <form id="postForm">


        <label>
          Post Title
        </label>

        <input
          id="title"
          type="text"
          placeholder="Enter post title"
          required
        >


        <label>
          Category
        </label>

        <select id="category" required>

          <option value="">
            Select category
          </option>

          <option value="Quran">
            Quran
          </option>

          <option value="Hadith">
            Hadith
          </option>

          <option value="Islamic Knowledge">
            Islamic Knowledge
          </option>

          <option value="Dua">
            Dua
          </option>

          <option value="Akhlaq">
            Akhlaq
          </option>

          <option value="Lifestyle">
            Lifestyle
          </option>

          <option value="News">
            News
          </option>

          <option value="Other">
            Other
          </option>

        </select>


        <label>
          Image URL
        </label>

        <input
          id="imageURL"
          type="url"
          placeholder="https://example.com/image.jpg"
        >


        <label>
          Post Content
        </label>

        <textarea
          id="content"
          placeholder="Write your post..."
          required
        ></textarea>


        <button
          class="publish"
          id="publishBtn"
          type="submit"
        >
          🚀 Publish Post
        </button>


        <div
          id="message"
          class="message"
        ></div>

      </form>

    </div>



    <!-- POSTS -->

    <div class="card">

      <h2>📚 Published Posts</h2>

      <div id="postsList">

        <div class="loading">
          Loading posts...
        </div>

      </div>

    </div>

  </div>

</div>


<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {

  getAuth,
  onAuthStateChanged,
  signOut

}

from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


import {

  getFirestore,
  doc,
  getDoc,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  serverTimestamp,
  query,
  orderBy

}

from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";



/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyC4sRpUYVLURCkbAbfvUccL5n71Dveiik4",

  authDomain:
    "qalb-e-deen-b765a.firebaseapp.com",

  projectId:
    "qalb-e-deen-b765a",

  storageBucket:
    "qalb-e-deen-b765a.firebasestorage.app",

  messagingSenderId:
    "226972777842",

  appId:
    "1:226972777842:web:0d1439b9d4dc66d8bfb1eb"

};



const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const db =
  getFirestore(app);



/* =========================
   ELEMENTS
========================= */

const statusText =
  document.getElementById("status");

const errorBox =
  document.getElementById("errorBox");

const dashboard =
  document.getElementById("dashboard");

const postForm =
  document.getElementById("postForm");

const postsList =
  document.getElementById("postsList");

const totalPosts =
  document.getElementById("totalPosts");

const message =
  document.getElementById("message");

const publishBtn =
  document.getElementById("publishBtn");

const logoutBtn =
  document.getElementById("logoutBtn");



/* =========================
   ERROR
========================= */

function showError(error){

  console.error(error);

  errorBox.classList.remove("hidden");

  errorBox.innerHTML =

    "<strong>Firebase Error</strong><br><br>" +

    escapeHTML(
      error?.message ||
      String(error)
    );

  statusText.textContent =
    "Admin verification failed";

}



/* =========================
   AUTH
========================= */

onAuthStateChanged(

  auth,

  async (user) => {

    try{

      if(!user){

        statusText.textContent =
          "You are not logged in.";

        setTimeout(() => {

          window.location.href =
            "login.html";

        }, 1200);

        return;

      }


      console.log(
        "Logged in UID:",
        user.uid
      );


      statusText.textContent =
        "Checking admin permission...";


      /*
        IMPORTANT:
        Collection name = user
        Document ID = Auth UID
      */

      const userRef =
        doc(
          db,
          "user",
          user.uid
        );


      const userSnap =
        await getDoc(userRef);


      if(!userSnap.exists()){

        throw new Error(

          "Your Firebase Authentication account " +

          "exists, but the Firestore document " +

          "user/" + user.uid +

          " was not found."

        );

      }


      const userData =
        userSnap.data();


      console.log(
        "Firestore user data:",
        userData
      );


      if(userData.role !== "admin"){

        throw new Error(

          "Your account does not have admin permission. " +

          "Current role: " +

          (userData.role || "not set")

        );

      }


      /* ADMIN VERIFIED */

      statusText.textContent =
        "Admin verified • " +
        (user.email || "");


      dashboard.classList.remove(
        "hidden"
      );


      errorBox.classList.add(
        "hidden"
      );


      await loadPosts();


    }catch(error){

      showError(error);

    }

  }

);



/* =========================
   CREATE POST
========================= */

postForm.addEventListener(

  "submit",

  async (event) => {

    event.preventDefault();


    const user =
      auth.currentUser;


    if(!user){

      showError(
        new Error(
          "You are not logged in."
        )
      );

      return;

    }


    const title =
      document
        .getElementById("title")
        .value
        .trim();


    const category =
      document
        .getElementById("category")
        .value;


    const imageURL =
      document
        .getElementById("imageURL")
        .value
        .trim();


    const content =
      document
        .getElementById("content")
        .value
        .trim();


    if(!title ||
       !category ||
       !content){

      showMessage(
        "Please complete the required fields.",
        false
      );

      return;

    }


    publishBtn.disabled =
      true;

    publishBtn.textContent =
      "Publishing...";


    try{

      /*
        Verify admin again
        before publishing
      */

      const userSnap =
        await getDoc(
          doc(
            db,
            "user",
            user.uid
          )
        );


      if(
        !userSnap.exists() ||
        userSnap.data().role !== "admin"
      ){

        throw new Error(
          "Admin permission verification failed."
        );

      }


      const userData =
        userSnap.data();


      await addDoc(

        collection(
          db,
          "posts"
        ),

        {

          title:

            title,

          category:

            category,

          imageURL:

            imageURL,

          content:

            content,

          authorId:

            user.uid,

          authorName:

            userData.name ||
            user.displayName ||
            "Qalb-e-Deen Admin",

          createdAt:

            serverTimestamp(),

          updatedAt:

            serverTimestamp()

        }

      );


      showMessage(
        "✅ Post published successfully!",
        true
      );


      postForm.reset();


      await loadPosts();


    }catch(error){

      showMessage(
        "❌ Publish failed: " +
        error.message,
        false
      );

      console.error(error);

    }


    publishBtn.disabled =
      false;

    publishBtn.textContent =
      "🚀 Publish Post";

  }

);



/* =========================
   LOAD POSTS
========================= */

async function loadPosts(){

  postsList.innerHTML =
    `<div class="loading">
      Loading posts...
    </div>`;


  try{

    const postsQuery =

      query(

        collection(
          db,
          "posts"
        ),

        orderBy(
          "createdAt",
          "desc"
        )

      );


    const snapshot =
      await getDocs(
        postsQuery
      );


    totalPosts.textContent =
      snapshot.size;


    if(snapshot.empty){

      postsList.innerHTML =
        `<div class="loading">
          No posts yet.
        </div>`;

      return;

    }


    postsList.innerHTML = "";


    snapshot.forEach(

      (postDoc) => {

        const post =
          postDoc.data();


        const div =
          document.createElement(
            "div"
          );


        div.className =
          "post";


        let date =
          "Recently";


        if(post.createdAt){

          date =
            post.createdAt
              .toDate()
              .toLocaleDateString();

        }


        div.innerHTML = `

          <div class="post-info">

            <h3>
              ${escapeHTML(
                post.title ||
                "Untitled"
              )}
            </h3>

            <div class="meta">

              ${escapeHTML(
                post.category ||
                "General"
              )}

              • ${date}

            </div>

          </div>


          <button
            class="delete"
            data-id="${postDoc.id}"
          >
            Delete
          </button>

        `;


        postsList.appendChild(
          div
        );

      }

    );


    document
      .querySelectorAll(".delete")
      .forEach(

        button => {

          button.addEventListener(

            "click",

            () => {

              deletePost(
                button.dataset.id
              );

            }

          );

        }

      );


  }catch(error){

    postsList.innerHTML = `

      <div class="error">

        <strong>
          Could not load posts
        </strong>

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}



/* =========================
   DELETE
========================= */

async function deletePost(
  postId
){

  if(
    !confirm(
      "Delete this post?"
    )
  ){

    return;

  }


  try{

    await deleteDoc(

      doc(
        db,
        "posts",
        postId
      )

    );


    await loadPosts();


  }catch(error){

    showError(error);

  }

}



/* =========================
   MESSAGE
========================= */

function showMessage(
  text,
  success
){

  message.style.display =
    "block";


  message.textContent =
    text;


  message.style.background =
    success
      ? "#e3f6ed"
      : "#fdeaea";


  message.style.color =
    success
      ? "#17633f"
      : "#a52828";

}



/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(
  value
){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener(

  "click",

  async () => {

    await signOut(auth);

    window.location.href =
      "login.html";

  }

);

</script>

</body>
</html>
