<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Post — Qalb-e-Deen</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f8f7;
  color:#17211f;
  line-height:1.7;
}

header{
  background:#0d2b24;
  color:white;
  position:sticky;
  top:0;
  z-index:100;
}

.navbar{
  max-width:1100px;
  margin:auto;
  padding:15px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

.logo span{
  color:#d7b56d;
}

.home-btn{
  text-decoration:none;
  background:#d7b56d;
  color:#0d2b24;
  padding:8px 14px;
  border-radius:8px;
  font-weight:bold;
}

.container{
  max-width:900px;
  margin:auto;
  padding:35px 16px 70px;
}

.post-card,
.comments-card{
  background:white;
  border-radius:18px;
  box-shadow:0 6px 25px rgba(0,0,0,.07);
}

.post-card{
  overflow:hidden;
}

.post-image{
  width:100%;
  max-height:500px;
  object-fit:cover;
  display:block;
}

.post-body{
  padding:30px;
}

.category{
  display:inline-block;
  background:#e7f3ee;
  color:#0d5b48;
  padding:6px 12px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
  margin-bottom:15px;
}

h1{
  font-size:38px;
  line-height:1.3;
  color:#0d2b24;
  margin-bottom:12px;
}

.meta{
  color:#777;
  font-size:14px;
  margin-bottom:25px;
}

.divider{
  height:1px;
  background:#e4e9e7;
  margin-bottom:25px;
}

.content{
  font-size:17px;
  color:#293532;
  white-space:pre-wrap;
  word-wrap:break-word;
}

.actions{
  margin-top:30px;
  padding-top:22px;
  border-top:1px solid #e4e9e7;
  display:flex;
  gap:10px;
}

.action-btn{
  border:0;
  cursor:pointer;
  padding:10px 16px;
  border-radius:8px;
  font-weight:bold;
  font-size:14px;
}

.share{
  background:#0d5b48;
  color:white;
}

.back{
  background:#edf2f0;
  color:#173a31;
  text-decoration:none;
}


/* =========================
   COMMENTS
========================= */

.comments-card{
  margin-top:25px;
  padding:25px;
}

.comments-card h2{
  color:#0d2b24;
  margin-bottom:20px;
}

.login-message{
  background:#f0f5f3;
  padding:15px;
  border-radius:10px;
  margin-bottom:20px;
  color:#52605c;
}

.login-message a{
  color:#0d5b48;
  font-weight:bold;
}

.comment-form{
  margin-bottom:25px;
}

.comment-form textarea{
  width:100%;
  min-height:120px;
  resize:vertical;
  border:1px solid #d8dfdc;
  border-radius:10px;
  padding:13px;
  font-size:15px;
  outline:none;
}

.comment-form textarea:focus{
  border-color:#0d5b48;
}

.comment-submit{
  margin-top:10px;
  background:#0d5b48;
  color:white;
  border:0;
  padding:11px 18px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.comment-submit:disabled{
  opacity:.6;
}

.comments-list{
  margin-top:15px;
}

.comment{
  border:1px solid #e3e8e6;
  border-radius:12px;
  padding:16px;
  margin-bottom:12px;
}

.comment-header{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:8px;
}

.comment-name{
  font-weight:bold;
  color:#0d2b24;
}

.comment-date{
  color:#888;
  font-size:12px;
}

.comment-text{
  color:#394641;
  white-space:pre-wrap;
  word-break:break-word;
}

.comment-delete{
  margin-top:10px;
  border:0;
  background:#d94b4b;
  color:white;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
}

.comment-loading,
.no-comments{
  text-align:center;
  padding:25px;
  color:#777;
}

.pending-note{
  background:#fff8e6;
  color:#856404;
  padding:10px;
  border-radius:8px;
  margin-bottom:15px;
  font-size:13px;
}

.error{
  background:#fff0f0;
  color:#a52828;
  padding:20px;
  border-radius:12px;
}

.not-found{
  background:white;
  text-align:center;
  padding:60px 20px;
  border-radius:16px;
}

footer{
  background:#0d2b24;
  color:white;
  text-align:center;
  padding:30px 15px;
}

.footer-logo{
  font-size:21px;
  font-weight:bold;
}

.footer-logo span{
  color:#d7b56d;
}

footer p{
  color:#bdccc7;
  font-size:13px;
  margin-top:5px;
}

@media(max-width:600px){

  h1{
    font-size:28px;
  }

  .post-body{
    padding:20px;
  }

  .comments-card{
    padding:20px;
  }

  .comment-header{
    flex-direction:column;
    gap:2px;
  }

}

</style>

</head>


<body>


<header>

  <div class="navbar">

    <div class="logo">
      Qalb<span>-e-Deen</span>
    </div>

    <a
      href="index.html"
      class="home-btn">

      ← Home

    </a>

  </div>

</header>



<main class="container">

  <div id="postArea">

    <div class="comment-loading">
      Loading post...
    </div>

  </div>


  <!-- COMMENTS -->

  <section
    class="comments-card"
    id="commentsSection">

    <h2>
      💬 Comments
    </h2>


    <!-- LOGIN MESSAGE -->

    <div
      id="loginMessage"
      class="login-message">

      Please
      <a href="login.html">
        login
      </a>
      to leave a comment.

    </div>


    <!-- COMMENT FORM -->

    <form
      id="commentForm"
      class="comment-form"
      style="display:none;">

      <textarea
        id="commentText"
        placeholder="Write your comment..."
        required
        maxlength="1000"
      ></textarea>


      <button
        type="submit"
        class="comment-submit"
        id="commentSubmit">

        💬 Post Comment

      </button>

    </form>


    <!-- COMMENTS LIST -->

    <div
      id="commentsList"
      class="comments-list">

      <div class="comment-loading">
        Loading comments...
      </div>

    </div>

  </section>

</main>



<footer>

  <div class="footer-logo">
    Qalb<span>-e-Deen</span>
  </div>

  <p>
    The Heart of Deen
  </p>

  <p>
    © 2026 Qalb-e-Deen. All rights reserved.
  </p>

</footer>



<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


import {
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  increment,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  query,
  where,
  orderBy,
  serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";



/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyC4sRpUYVLURCkbAbfvUccL5n71Dveiik4",

  authDomain:
    "qalb-e-deen-b765a.firebaseapp.com",

  projectId:
    "qalb-e-deen-b765a",

  storageBucket:
    "qalb-e-deen-b765a.firebasestorage.app",

  messagingSenderId:
    "226972777842",

  appId:
    "1:226972777842:web:0d1439b9d4dc66d8bfb1eb"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);



/* =========================
   ELEMENTS
========================= */

const postArea =
  document.getElementById(
    "postArea"
  );

const loginMessage =
  document.getElementById(
    "loginMessage"
  );

const commentForm =
  document.getElementById(
    "commentForm"
  );

const commentText =
  document.getElementById(
    "commentText"
  );

const commentSubmit =
  document.getElementById(
    "commentSubmit"
  );

const commentsList =
  document.getElementById(
    "commentsList"
  );



/* =========================
   POST ID
========================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const postId =
  params.get("id");



let currentUser = null;

let isAdmin = false;



/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(

  auth,

  async (user) => {

    currentUser = user;

    isAdmin = false;


    if(user){

      loginMessage.style.display =
        "none";

      commentForm.style.display =
        "block";


      try{

        const userSnap =
          await getDoc(
            doc(
              db,
              "user",
              user.uid
            )
          );


        if(
          userSnap.exists() &&
          userSnap.data().role === "admin"
        ){

          isAdmin = true;

        }

      }catch(error){

        console.log(
          "Admin check error:",
          error
        );

      }

    }else{

      loginMessage.style.display =
        "block";

      commentForm.style.display =
        "none";

    }


    loadComments();

  }

);



/* =========================
   LOAD POST
========================= */

async function loadPost(){

  if(!postId){

    showNotFound(
      "No post ID was provided."
    );

    return;

  }


  try{

    const postRef =
      doc(
        db,
        "posts",
        postId
      );


    const postSnap =
      await getDoc(
        postRef
      );


    if(!postSnap.exists()){

      showNotFound(
        "This post could not be found."
      );

      return;

    }


    const post =
      postSnap.data();


    try{

      await updateDoc(

        postRef,

        {
          views:
            increment(1)
        }

      );

    }catch(error){

      console.log(
        "View counter error:",
        error
      );

    }


    renderPost(post);


  }catch(error){

    postArea.innerHTML = `

      <div class="error">

        Could not load post.

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}



/* =========================
   RENDER POST
========================= */

function renderPost(post){

  const title =
    post.title ||
    "Untitled Post";

  const category =
    post.category ||
    "General";

  const content =
    post.content ||
    "No content available.";

  const image =
    post.imageURL ||
    "https://images.unsplash.com/photo-1609599006353-e629aaabfeae?auto=format&fit=crop&w=1200&q=80";

  const author =
    post.authorName ||
    "Qalb-e-Deen";

  let date =
    "Recently";

  if(post.createdAt){

    try{

      date =
        post.createdAt
          .toDate()
          .toLocaleDateString(
            "en-US",
            {
              year:"numeric",
              month:"long",
              day:"numeric"
            }
          );

    }catch(error){}

  }

  const views =
    Number(
      post.views || 0
    ) + 1;


  document.title =
    title +
    " — Qalb-e-Deen";


  postArea.innerHTML = `

    <article class="post-card">

      <img
        class="post-image"
        src="${escapeAttribute(image)}"
        alt="${escapeAttribute(title)}"
        onerror="this.style.display='none'"
      >

      <div class="post-body">

        <span class="category">
          ${escapeHTML(category)}
        </span>

        <h1>
          ${escapeHTML(title)}
        </h1>

        <div class="meta">

          By ${escapeHTML(author)}

          •

          ${escapeHTML(date)}

          •

          👁️ ${views} views

        </div>

        <div class="divider"></div>

        <div class="content">
          ${escapeHTML(content)}
        </div>

        <div class="actions">

          <button
            class="action-btn share"
            id="shareBtn">

            📤 Share Post

          </button>

          <a
            href="index.html"
            class="action-btn back">

            ← Back to Home

          </a>

        </div>

      </div>

    </article>

  `;


  document
    .getElementById("shareBtn")
    .addEventListener(
      "click",
      sharePost
    );

}



/* =========================
   LOAD COMMENTS
========================= */

async function loadComments(){

  if(!postId){

    return;

  }


  commentsList.innerHTML = `

    <div class="comment-loading">
      Loading comments...
    </div>

  `;


  try{

    const commentsQuery =
      query(

        collection(
          db,
          "comments"
        ),

        where(
          "postId",
          "==",
          postId
        ),

        where(
          "approved",
          "==",
          true
        ),

        orderBy(
          "createdAt",
          "desc"
        )

      );


    const snapshot =
      await getDocs(
        commentsQuery
      );


    if(snapshot.empty){

      commentsList.innerHTML = `

        <div class="no-comments">

          No comments yet.
          Be the first to comment.

        </div>

      `;

      return;

    }


    commentsList.innerHTML = "";


    snapshot.forEach(

      commentDoc => {

        const comment =
          commentDoc.data();


        commentsList.appendChild(

          createComment(
            commentDoc.id,
            comment
          )

        );

      }

    );


  }catch(error){

    console.error(
      error
    );


    commentsList.innerHTML = `

      <div class="error">

        Could not load comments.

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}



/* =========================
   CREATE COMMENT UI
========================= */

function createComment(
  commentId,
  comment
){

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "comment";


  let date =
    "Recently";


  if(comment.createdAt){

    try{

      date =
        comment.createdAt
          .toDate()
          .toLocaleDateString(
            "en-US",
            {
              year:"numeric",
              month:"short",
              day:"numeric"
            }
          );

    }catch(error){}

  }


  div.innerHTML = `

    <div class="comment-header">

      <span class="comment-name">

        ${escapeHTML(
          comment.userName ||
          "User"
        )}

      </span>

      <span class="comment-date">

        ${escapeHTML(date)}

      </span>

    </div>


    <div class="comment-text">

      ${escapeHTML(
        comment.text ||
        ""
      )}

    </div>

  `;


  if(
    currentUser &&
    (
      currentUser.uid ===
      comment.userId ||
      isAdmin
    )
  ){

    const deleteBtn =
      document.createElement(
        "button"
      );

    deleteBtn.className =
      "comment-delete";

    deleteBtn.textContent =
      "Delete";


    deleteBtn.addEventListener(

      "click",

      async () => {

        if(
          !confirm(
            "Delete this comment?"
          )
        ){

          return;

        }


        try{

          await deleteDoc(

            doc(
              db,
              "comments",
              commentId
            )

          );


          await loadComments();


        }catch(error){

          alert(
            "Delete failed: " +
            error.message
          );

        }

      }

    );


    div.appendChild(
      deleteBtn
    );

  }


  return div;

}



/* =========================
   SUBMIT COMMENT
========================= */

commentForm.addEventListener(

  "submit",

  async (event) => {

    event.preventDefault();


    if(!currentUser){

      alert(
        "Please login first."
      );

      return;

    }


    const text =
      commentText.value.trim();


    if(!text){

      return;

    }


    commentSubmit.disabled =
      true;

    commentSubmit.textContent =
      "Posting...";


    try{

      let userName =
        currentUser.displayName ||
        "User";


      const userSnap =
        await getDoc(

          doc(
            db,
            "user",
            currentUser.uid
          )

        );


      if(userSnap.exists()){

        userName =
          userSnap.data().name ||
          userName;

      }


      await addDoc(

        collection(
          db,
          "comments"
        ),

        {

          postId:
            postId,

          userId:
            currentUser.uid,

          userName:
            userName,

          text:
            text,

          approved:
            false,

          createdAt:
            serverTimestamp()

        }

      );


      commentText.value =
        "";


      alert(
        "✅ Comment submitted. It will appear after admin approval."
      );


    }catch(error){

      alert(
        "Comment failed: " +
        error.message
      );


    }


    commentSubmit.disabled =
      false;

    commentSubmit.textContent =
      "💬 Post Comment";

  }

);



/* =========================
   SHARE
========================= */

async function sharePost(){

  try{

    if(navigator.share){

      await navigator.share({

        title:
          document.title,

        text:
          "Read this post on Qalb-e-Deen",

        url:
          window.location.href

      });

    }else{

      await navigator.clipboard.writeText(
        window.location.href
      );

      alert(
        "Post link copied!"
      );

    }

  }catch(error){}

}



/* =========================
   NOT FOUND
========================= */

function showNotFound(message){

  postArea.innerHTML = `

    <div class="not-found">

      <h2>
        Post Not Found
      </h2>

      <p>
        ${escapeHTML(message)}
      </p>

      <br>

      <a
        href="index.html"
        class="action-btn back">

        ← Back to Home

      </a>

    </div>

  `;

}



/* =========================
   ESCAPE
========================= */

function escapeHTML(value){

  return String(value)

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttribute(value){

  return String(value)

    .replaceAll("&","&amp;")
    .replaceAll('"',"&quot;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");

}



/* =========================
   START
========================= */

loadPost();

</script>

</body>

</html>
