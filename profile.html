<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Profile — Qalb-e-Deen</title>

  <meta name="description"
        content="Manage your Qalb-e-Deen profile.">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      min-height:100vh;
      font-family:Arial,Helvetica,sans-serif;
      background:
        radial-gradient(circle at top,#173b35 0%,#081512 45%,#050b0a 100%);
      color:#fff;
      padding:20px;
    }

    .navbar{
      max-width:1000px;
      margin:0 auto 25px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px 20px;
      background:rgba(12,28,24,.9);
      border:1px solid rgba(216,180,90,.15);
      border-radius:16px;
    }

    .logo{
      color:#f3d98b;
      font-family:Georgia,serif;
      font-size:22px;
      font-weight:bold;
      text-decoration:none;
    }

    .nav-links{
      display:flex;
      gap:10px;
    }

    .nav-links a{
      color:#b9c6c1;
      text-decoration:none;
      font-size:14px;
    }

    .nav-links a:hover{
      color:#f3d98b;
    }

    .container{
      max-width:700px;
      margin:auto;
    }

    .card{
      background:rgba(14,31,27,.95);
      border:1px solid rgba(216,180,90,.18);
      border-radius:25px;
      padding:30px;
      box-shadow:0 25px 80px rgba(0,0,0,.45);
    }

    .profile-header{
      text-align:center;
      padding-bottom:25px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .avatar-wrapper{
      position:relative;
      width:115px;
      height:115px;
      margin:0 auto 15px;
    }

    .avatar{
      width:115px;
      height:115px;
      border-radius:50%;
      object-fit:cover;
      border:3px solid #d8b45a;
      background:#10251f;
      display:block;
    }

    .avatar-placeholder{
      width:115px;
      height:115px;
      border-radius:50%;
      border:3px solid #d8b45a;
      background:linear-gradient(135deg,#173b35,#091511);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:45px;
      color:#d8b45a;
    }

    .profile-header h1{
      font-family:Georgia,serif;
      color:#f3d98b;
      font-size:28px;
      margin-bottom:7px;
    }

    .email{
      color:#9ca9a4;
      font-size:14px;
    }

    .role{
      display:inline-block;
      margin-top:12px;
      padding:6px 13px;
      border-radius:20px;
      background:rgba(216,180,90,.12);
      color:#e8ca7b;
      border:1px solid rgba(216,180,90,.2);
      font-size:12px;
      font-weight:bold;
      text-transform:uppercase;
      letter-spacing:.5px;
    }

    .section{
      margin-top:25px;
    }

    .section-title{
      color:#f3d98b;
      font-family:Georgia,serif;
      font-size:20px;
      margin-bottom:17px;
    }

    .input-group{
      margin-bottom:17px;
    }

    label{
      display:block;
      color:#d1dad6;
      font-size:14px;
      margin-bottom:7px;
    }

    input,
    textarea{
      width:100%;
      border:1px solid #29443d;
      background:#081512;
      color:#fff;
      border-radius:12px;
      padding:13px 14px;
      outline:none;
      font-size:15px;
      font-family:inherit;
    }

    input:focus,
    textarea:focus{
      border-color:#d8b45a;
      box-shadow:0 0 0 3px rgba(216,180,90,.08);
    }

    textarea{
      min-height:110px;
      resize:vertical;
    }

    input:disabled{
      opacity:.65;
      cursor:not-allowed;
    }

    .btn{
      border:0;
      border-radius:12px;
      padding:13px 18px;
      font-size:15px;
      font-weight:bold;
      cursor:pointer;
      transition:.2s;
    }

    .btn-primary{
      width:100%;
      background:linear-gradient(135deg,#d8b45a,#f0d487);
      color:#10241f;
    }

    .btn-primary:hover{
      transform:translateY(-1px);
      box-shadow:0 8px 25px rgba(216,180,90,.2);
    }

    .btn-danger{
      width:100%;
      margin-top:12px;
      background:#351b1b;
      border:1px solid #693333;
      color:#ffaaa5;
    }

    .btn-danger:hover{
      background:#4a2020;
    }

    .message{
      display:none;
      margin-top:15px;
      padding:12px;
      border-radius:10px;
      font-size:14px;
      line-height:1.5;
    }

    .message.show{
      display:block;
    }

    .message.success{
      background:rgba(70,190,130,.12);
      border:1px solid rgba(70,190,130,.3);
      color:#9ff0c7;
    }

    .message.error{
      background:rgba(220,70,70,.12);
      border:1px solid rgba(220,70,70,.3);
      color:#ffaaa5;
    }

    .loading{
      text-align:center;
      padding:60px 20px;
      color:#b5c0bc;
    }

    .hidden{
      display:none!important;
    }

    .info-box{
      padding:15px;
      border-radius:12px;
      background:#091713;
      border:1px solid rgba(255,255,255,.06);
      color:#aebbb6;
      font-size:13px;
      line-height:1.6;
      margin-bottom:20px;
    }

    .footer{
      text-align:center;
      max-width:700px;
      margin:20px auto;
      color:#697873;
      font-size:12px;
    }

    @media(max-width:600px){

      body{
        padding:12px;
      }

      .navbar{
        padding:13px 15px;
      }

      .nav-links{
        gap:6px;
      }

      .card{
        padding:22px 17px;
      }

      .profile-header h1{
        font-size:25px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">

    <a href="index.html" class="logo">
      Qalb-e-Deen
    </a>

    <div class="nav-links">
      <a href="index.html">Home</a>
    </div>

  </nav>


  <!-- LOADING -->
  <div id="loading" class="container">

    <div class="card loading">
      Loading your profile...
    </div>

  </div>


  <!-- PROFILE -->
  <main id="profileContainer" class="container hidden">

    <div class="card">

      <!-- PROFILE HEADER -->
      <div class="profile-header">

        <div class="avatar-wrapper">

          <div id="avatarPlaceholder"
               class="avatar-placeholder">
            ☪
          </div>

          <img
            id="avatar"
            class="avatar hidden"
            alt="Profile picture"
          >

        </div>

        <h1 id="displayName">
          User
        </h1>

        <div id="displayEmail" class="email">
          —
        </div>

        <div id="displayRole" class="role">
          User
        </div>

      </div>


      <!-- EDIT PROFILE -->
      <section class="section">

        <h2 class="section-title">
          Edit Profile
        </h2>

        <div class="info-box">
          Keep your profile information updated.
          Your email address is managed by Firebase
          Authentication.
        </div>


        <form id="profileForm">

          <div class="input-group">

            <label for="name">
              Full Name
            </label>

            <input
              type="text"
              id="name"
              placeholder="Your full name"
              required
            >

          </div>


          <div class="input-group">

            <label for="email">
              Email Address
            </label>

            <input
              type="email"
              id="email"
              disabled
            >

          </div>


          <div class="input-group">

            <label for="photoURL">
              Profile Picture URL
            </label>

            <input
              type="url"
              id="photoURL"
              placeholder="https://example.com/photo.jpg"
            >

          </div>


          <div class="input-group">

            <label for="bio">
              About Me
            </label>

            <textarea
              id="bio"
              placeholder="Tell something about yourself..."
            ></textarea>

          </div>


          <button
            type="submit"
            id="saveBtn"
            class="btn btn-primary"
          >
            Save Profile
          </button>

        </form>


        <div id="message" class="message"></div>

      </section>


      <!-- ACCOUNT -->
      <section class="section">

        <h2 class="section-title">
          Account
        </h2>

        <button
          id="logoutBtn"
          class="btn btn-danger"
        >
          Logout
        </button>

      </section>

    </div>

  </main>


  <div class="footer">
    © 2026 Qalb-e-Deen — The Heart of Deen
  </div>
