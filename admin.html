<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Qalb-e-Deen — Admin Panel</title>

<style>
:root{
  --bg:#061710;
  --card:#0d2920;
  --card2:#12352a;
  --gold:#d9b45b;
  --text:#f4f1e7;
  --muted:#aebdb6;
  --danger:#d95c5c;
  --success:#55c98a;
  --border:#25473b;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:linear-gradient(135deg,#061710,#0a241b);
  color:var(--text);
  font-family:Arial,sans-serif;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:24px;
}

.brand{
  color:var(--gold);
  font-size:28px;
  font-weight:800;
}

.sub{
  color:var(--muted);
  margin-top:5px;
  margin-bottom:22px;
}

.card{
  background:rgba(13,41,32,.96);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 12px 35px #0004;
}

h2{
  margin-top:0;
  color:var(--gold);
}

label{
  display:block;
  margin:14px 0 7px;
  font-weight:700;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#071b15;
  color:var(--text);
  outline:none;
}

textarea{
  min-height:180px;
  resize:vertical;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 17px;
  cursor:pointer;
  font-weight:700;
  margin:8px 6px 0 0;
}

.primary{
  background:var(--gold);
  color:#102018;
}

.secondary{
  background:var(--card2);
  color:var(--text);
  border:1px solid var(--border);
}

.danger{
  background:var(--danger);
  color:white;
}

.status{
  padding:12px;
  border-radius:10px;
  margin:12px 0;
  background:#082219;
  color:var(--muted);
}

.hidden{
  display:none;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.post{
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
  margin:12px 0;
  background:#0a2119;
}

.post h3{
  margin:0 0 7px;
}

.meta{
  color:var(--muted);
  font-size:13px;
}

.actions{
  margin-top:10px;
}

/* COMMENTS */

.comment{
  border:1px solid var(--border);
  background:#0a2119;
  border-radius:14px;
  padding:16px;
  margin:12px 0;
}

.comment-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
}

.comment-user{
  color:var(--gold);
  font-weight:800;
  font-size:16px;
}

.comment-post{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

.comment-text{
  margin-top:14px;
  line-height:1.7;
  white-space:pre-wrap;
  word-break:break-word;
}

.comment-date{
  color:var(--muted);
  font-size:12px;
  margin-top:10px;
}

.empty{
  padding:25px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--border);
  border-radius:12px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:20px;
}

.stat{
  background:#0a2119;
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
}

.stat-number{
  font-size:28px;
  font-weight:800;
  color:var(--gold);
}

.stat-label{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

.comment-count{
  display:inline-block;
  background:#1c4737;
  color:var(--gold);
  padding:4px 9px;
  border-radius:20px;
  font-size:12px;
  margin-left:8px;
}

#loginCard{
  max-width:520px;
  margin:50px auto;
}

@media(max-width:700px){

  .row{
    grid-template-columns:1fr;
  }

  .topbar{
    align-items:flex-start;
    flex-direction:column;
  }

  .container{
    padding:14px;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .comment-top{
    flex-direction:column;
  }

  .comment-top button{
    width:100%;
  }
}
</style>
</head>

<body>

<div class="container">

<!-- ================= LOGIN ================= -->

<div id="loginCard" class="card">

  <div class="brand">Qalb-e-Deen</div>

  <div class="sub">
    Admin Panel · The Heart of Deen
  </div>

  <h2>Admin Login</h2>

  <div id="loginStatus" class="status">
    Sign in with your admin account.
  </div>

  <label>Email</label>

  <input
    id="email"
    type="email"
    placeholder="Admin email"
  >

  <label>Password</label>

  <input
    id="password"
    type="password"
    placeholder="Password"
  >

  <button class="primary" id="loginBtn">
    Login
  </button>

</div>


<!-- ================= ADMIN APP ================= -->

<div id="adminApp" class="hidden">

  <!-- TOP BAR -->

  <div class="topbar">

    <div>

      <div class="brand">
        Qalb-e-Deen
      </div>

      <div class="sub">
        Content Management Dashboard
      </div>

    </div>

    <button class="secondary" id="logoutBtn">
      Logout
    </button>

  </div>


  <!-- ================= STATS ================= -->

  <div class="stats">

    <div class="stat">

      <div
        id="postCount"
        class="stat-number"
      >
        0
      </div>

      <div class="stat-label">
        Total Posts
      </div>

    </div>


    <div class="stat">

      <div
        id="commentCount"
        class="stat-number"
      >
        0
      </div>

      <div class="stat-label">
        Total Comments
      </div>

    </div>


    <div class="stat">

      <div
        id="viewCount"
        class="stat-number"
      >
        0
      </div>

      <div class="stat-label">
        Total Views
      </div>

    </div>

  </div>


  <!-- ================= CREATE / EDIT POST ================= -->

  <div class="card">

    <h2 id="formTitle">
      Create Post
    </h2>

    <input
      id="editId"
      type="hidden"
    >


    <div class="row">

      <div>

        <label>
          Post Title
        </label>

        <input
          id="title"
          placeholder="Post title"
        >

      </div>


      <div>

        <label>
          Category
        </label>

        <select id="category">

          <option>
            Quran
          </option>

          <option>
            Hadith
          </option>

          <option>
            Islamic Knowledge
          </option>

          <option>
            Seerah
          </option>

          <option>
            Dua & Zikr
          </option>

          <option>
            Ramadan
          </option>

          <option>
            News
          </option>

          <option>
            Opinion
          </option>

        </select>

      </div>

    </div>


    <label>
      Short Description
    </label>

    <textarea
      id="excerpt"
      style="min-height:100px"
      placeholder="Short description..."
    ></textarea>


    <label>
      Featured Image URL
    </label>

    <input
      id="imageURL"
      placeholder="https://..."
    >


    <label>
      Post Content
    </label>

    <textarea
      id="content"
      placeholder="Write your post here..."
    ></textarea>


    <label>

      <input
        id="published"
        type="checkbox"
        style="width:auto"
      >

      Publish this post

    </label>


    <div>

      <button
        class="primary"
        id="saveBtn"
      >
        Publish Post
      </button>


      <button
        class="secondary"
        id="clearBtn"
      >
        Clear
      </button>

    </div>


    <div
      id="saveStatus"
      class="status hidden"
    ></div>

  </div>


  <!-- ================= POSTS ================= -->

  <div class="card">

    <h2>
      Posts
    </h2>

    <div id="posts">
      Loading...
    </div>

  </div>


  <!-- ================= COMMENT MODERATION ================= -->

  <div class="card">

    <h2>
      Comment Moderation

      <span
        id="commentBadge"
        class="comment-count"
      >
        0
      </span>

    </h2>


    <div
      id="commentStatus"
      class="status"
    >
      Loading comments...
    </div>


    <div id="comments">

    </div>

  </div>

</div>

</div>


<!-- ================= FIREBASE ================= -->

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
  getFirestore,
  collection,
  addDoc,
  updateDoc,
  deleteDoc,
  doc,
  getDoc,
  getDocs,
  query,
  orderBy,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";



/* ================= FIREBASE CONFIG ================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyC4sRpUYVLURCkbAbfvUccL5n71Dveiik4",

  authDomain:
    "qalb-e-deen-b765a.firebaseapp.com",

  projectId:
    "qalb-e-deen-b765a",

  storageBucket:
    "qalb-e-deen-b765a.firebasestorage.app",

  messagingSenderId:
    "226972777842",

  appId:
    "1:226972777842:web:0d1439b9d4dc66d8bfb1eb"

};



const app =
  initializeApp(firebaseConfig);


const db =
  getFirestore(app);


const auth =
  getAuth(app);



const $ = id =>
  document.getElementById(id);



/* ================= DATA ================= */

let posts = [];
let comments = [];



/* ================= STATUS ================= */

function setStatus(
  element,
  message,
  show = true
){

  element.textContent = message;

  element.classList.toggle(
    "hidden",
    !show
  );

}



/* ================= LOGIN ================= */

$("loginBtn").onclick = async () => {

  const email =
    $("email").value.trim();

  const password =
    $("password").value;


  if(!email || !password){

    setStatus(
      $("loginStatus"),
      "Enter email and password."
    );

    return;
  }


  setStatus(
    $("loginStatus"),
    "Logging in..."
  );


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    setStatus(
      $("loginStatus"),
      "Login failed: " +
      error.message
    );

  }

};



/* ================= LOGOUT ================= */

$("logoutBtn").onclick =
  () => signOut(auth);



/* ================= ADMIN AUTH CHECK ================= */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      $("loginCard")
        .classList
        .remove("hidden");

      $("adminApp")
        .classList
        .add("hidden");

      return;
    }


    try{

      /*
        IMPORTANT:
        Current project uses:
        user/{uid}
      */

      const adminRef =
        doc(
          db,
          "user",
          user.uid
        );


      const adminSnap =
        await getDoc(adminRef);


      if(
        !adminSnap.exists() ||
        adminSnap.data().role !== "admin"
      ){

        await signOut(auth);

        setStatus(
          $("loginStatus"),
          "This account does not have admin access."
        );

        return;
      }


      $("loginCard")
        .classList
        .add("hidden");


      $("adminApp")
        .classList
        .remove("hidden");


      await loadPosts();

      await loadComments();

    }catch(error){

      setStatus(
        $("loginStatus"),
        "Admin verification failed: " +
        error.message
      );

    }

  }
);



/* ================= CLEAR FORM ================= */

function clearForm(){

  $("editId").value = "";

  $("title").value = "";

  $("excerpt").value = "";

  $("imageURL").value = "";

  $("content").value = "";

  $("published").checked = false;

  $("formTitle").textContent =
    "Create Post";

  $("saveBtn").textContent =
    "Publish Post";

}



$("clearBtn").onclick =
  clearForm;



/* ================= SAVE POST ================= */

$("saveBtn").onclick =
async () => {

  const user =
    auth.currentUser;


  if(!user){

    alert("Please login first.");

    return;
  }


  const title =
    $("title").value.trim();


  const content =
    $("content").value.trim();


  if(!title || !content){

    setStatus(
      $("saveStatus"),
      "Post title and content are required."
    );

    return;
  }


  const data = {

    title,

    category:
      $("category").value,

    imageURL:
      $("imageURL").value.trim(),

    excerpt:
      $("excerpt").value.trim(),

    content,

    published:
      $("published").checked,

    authorId:
      user.uid,

    authorName:
      user.email || "Admin",

    updatedAt:
      serverTimestamp()

  };


  setStatus(
    $("saveStatus"),
    "Saving..."
  );


  try{

    const editId =
      $("editId").value;


    if(editId){

      await updateDoc(
        doc(
          db,
          "posts",
          editId
        ),
        data
      );

      setStatus(
        $("saveStatus"),
        "Post updated successfully."
      );

    }else{

      data.createdAt =
        serverTimestamp();

      data.views = 0;

      await addDoc(
        collection(
          db,
          "posts"
        ),
        data
      );

      setStatus(
        $("saveStatus"),
        "Post published successfully."
      );

    }


    clearForm();

    await loadPosts();

  }catch(error){

    setStatus(
      $("saveStatus"),
      "Save failed: " +
      error.message
    );

  }

};



/* ================= LOAD POSTS ================= */

async function loadPosts(){

  const box =
    $("posts");


  box.textContent =
    "Loading posts...";


  try{

    const postsQuery =
      query(
        collection(db,"posts"),
        orderBy(
          "createdAt",
          "desc"
        )
      );


    const snapshot =
      await getDocs(postsQuery);


    posts =
      snapshot.docs.map(
        item => ({
          id:item.id,
          ...item.data()
        })
      );


    renderPosts();

    updateStats();

  }catch(error){

    box.innerHTML =
      "<div class='empty'>" +
      "Could not load posts: " +
      escapeHtml(error.message) +
      "</div>";

  }

}



/* ================= RENDER POSTS ================= */

function renderPosts(){

  const box =
    $("posts");


  if(!posts.length){

    box.innerHTML =
      "<div class='empty'>" +
      "No posts yet." +
      "</div>";

    return;
  }


  box.innerHTML =
    posts.map(
      post => `

      <div class="post">

        <h3>
          ${escapeHtml(
            post.title ||
            "Untitled"
          )}
        </h3>

        <div class="meta">

          ${escapeHtml(
            post.category ||
            ""
          )}

          ·

          ${
            post.published
              ? "Published"
              : "Draft"
          }

          ·

          ${
            Number(
              post.views || 0
            )
          }

          views

        </div>


        <div class="actions">

          <button
            class="secondary"
            onclick="editPost('${post.id}')"
          >
            Edit
          </button>


          <button
            class="danger"
            onclick="deletePost('${post.id}')"
          >
            Delete
          </button>

        </div>

      </div>

    `
    ).join("");

}



/* ================= EDIT POST ================= */

window.editPost =
function(id){

  const post =
    posts.find(
      item => item.id === id
    );


  if(!post) return;


  $("editId").value =
    id;

  $("title").value =
    post.title || "";

  $("category").value =
    post.category ||
    "Quran";

  $("excerpt").value =
    post.excerpt || "";

  $("imageURL").value =
    post.imageURL || "";

  $("content").value =
    post.content || "";

  $("published").checked =
    !!post.published;


  $("formTitle").textContent =
    "Edit Post";


  $("saveBtn").textContent =
    "Update Post";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};



/* ================= DELETE POST ================= */

window.deletePost =
async function(id){

  const post =
    posts.find(
      item => item.id === id
    );


  const title =
    post?.title ||
    "this post";


  if(
    !confirm(
      `Delete "${title}"?`
    )
  ){

    return;
  }


  try{

    await deleteDoc(
      doc(
        db,
        "posts",
        id
      )
    );


    await loadPosts();

  }catch(error){

    alert(
      "Delete failed: " +
      error.message
    );

  }

};



/* ==================================================
   COMMENT MODERATION
================================================== */


/* ================= LOAD COMMENTS ================= */

async function loadComments(){

  const status =
    $("commentStatus");


  const box =
    $("comments");


  status.classList.remove(
    "hidden"
  );


  status.textContent =
    "Loading comments...";


  try{

    /*
      Current structure:

      comments/{commentId}

      Fields:

      postId
      userId
      userName
      text
      createdAt
    */

    const commentsQuery =
      query(
        collection(
          db,
          "comments"
        ),
        orderBy(
          "createdAt",
          "desc"
        )
      );


    const commentSnapshot =
      await getDocs(
        commentsQuery
      );


    comments =
      commentSnapshot.docs.map(
        item => ({
          id:item.id,
          ...item.data()
        })
      );


    /*
      Get post titles
      so admin can see
      which post each comment belongs to.
    */

    const postMap = {};


    posts.forEach(
      post => {

        postMap[post.id] =
          post.title ||
          "Untitled";

      }
    );


    comments =
      comments.map(
        comment => ({

          ...comment,

          postTitle:
            postMap[
              comment.postId
            ] ||
            "Unknown Post"

        })
      );


    renderComments();


    updateStats();


    status.classList.add(
      "hidden"
    );

  }catch(error){

    status.textContent =
      "Could not load comments: " +
      error.message;

    box.innerHTML =
      "<div class='empty'>" +
      "Please check Firebase Rules / Index." +
      "</div>";

  }

}



/* ================= RENDER COMMENTS ================= */

function renderComments(){

  const box =
    $("comments");


  $("commentBadge")
    .textContent =
    comments.length;


  if(!comments.length){

    box.innerHTML =
      "<div class='empty'>" +
      "No comments yet." +
      "</div>";

    return;
  }


  box.innerHTML =
    comments.map(
      comment => `

      <div class="comment">

        <div class="comment-top">

          <div>

            <div class="comment-user">

              ${escapeHtml(
                comment.userName ||
                "Anonymous"
              )}

            </div>


            <div class="comment-post">

              Post:
              ${escapeHtml(
                comment.postTitle
              )}

            </div>

          </div>


          <button
            class="danger"
            onclick="deleteComment('${comment.id}')"
          >
            Delete Comment
          </button>

        </div>


        <div class="comment-text">

          ${escapeHtml(
            comment.text ||
            ""
          )}

        </div>


        <div class="comment-date">

          ${formatDate(
            comment.createdAt
          )}

        </div>

      </div>

    `
    ).join("");

}



/* ================= DELETE COMMENT ================= */

window.deleteComment =
async function(commentId){

  const comment =
    comments.find(
      item =>
        item.id === commentId
    );


  if(!comment) return;


  const userName =
    comment.userName ||
    "this user";


  if(
    !confirm(
      `Delete this comment from ${userName}?`
    )
  ){

    return;
  }


  try{

    await deleteDoc(
      doc(
        db,
        "comments",
        commentId
      )
    );


    await loadComments();

  }catch(error){

    alert(
      "Comment deletion failed: " +
      error.message
    );

  }

};



/* ================= STATS ================= */

function updateStats(){

  $("postCount")
    .textContent =
    posts.length
      .toLocaleString();


  $("commentCount")
    .textContent =
    comments.length
      .toLocaleString();


  $("commentBadge")
    .textContent =
    comments.length
      .toLocaleString();


  const totalViews =
    posts.reduce(
      (
        total,
        post
      ) =>
        total +
        Number(
          post.views || 0
        ),
      0
    );


  $("viewCount")
    .textContent =
    totalViews
      .toLocaleString();

}



/* ================= DATE ================= */

function formatDate(timestamp){

  if(!timestamp){

    return "Date unavailable";

  }


  try{

    let date;


    if(
      typeof timestamp.toDate ===
      "function"
    ){

      date =
        timestamp.toDate();

    }else{

      date =
        new Date(timestamp);

    }


    return date.toLocaleString(
      "en-BD",
      {
        year:"numeric",
        month:"short",
        day:"numeric",
        hour:"numeric",
        minute:"2-digit"
      }
    );

  }catch{

    return "Date unavailable";

  }

}



/* ================= ESCAPE HTML ================= */

function escapeHtml(value){

  return String(value)
    .replace(
      /[&<>"']/g,
      character => ({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      })[character]
    );

}

</script>

</body>
</html>
