<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Qalb-e-Deen — The Heart of Deen</title>

<meta name="description"
      content="Qalb-e-Deen — The Heart of Deen. Islamic knowledge, Quran, Hadith, Dua and more.">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:#f5f8f7;
  color:#17211f;
  line-height:1.6;
}

/* =========================
   HEADER
========================= */

header{
  background:#0d2b24;
  color:white;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 3px 15px rgba(0,0,0,.15);
}

.navbar{
  max-width:1200px;
  margin:auto;
  padding:15px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:24px;
  font-weight:bold;
  white-space:nowrap;
}

.logo span{
  color:#d7b56d;
}

.nav-links{
  display:flex;
  gap:22px;
  align-items:center;
}

.nav-links a{
  color:white;
  text-decoration:none;
  font-size:15px;
}

.nav-links a:hover{
  color:#d7b56d;
}

.login-btn{
  background:#d7b56d;
  color:#0d2b24 !important;
  padding:8px 14px;
  border-radius:8px;
  font-weight:bold;
}

/* =========================
   HERO
========================= */

.hero{
  background:
    linear-gradient(
      rgba(13,43,36,.93),
      rgba(13,43,36,.93)
    );
  color:white;
  padding:75px 18px;
}

.hero-inner{
  max-width:1100px;
  margin:auto;
  text-align:center;
}

.hero h1{
  font-size:45px;
  margin-bottom:12px;
}

.hero h1 span{
  color:#d7b56d;
}

.hero p{
  max-width:700px;
  margin:auto;
  color:#d9e3df;
  font-size:18px;
}

/* =========================
   SEARCH
========================= */

.search-area{
  max-width:900px;
  margin:-30px auto 30px;
  padding:0 16px;
  position:relative;
  z-index:5;
}

.search-box{
  background:white;
  padding:10px;
  border-radius:14px;
  box-shadow:0 8px 30px rgba(0,0,0,.12);
  display:flex;
  gap:10px;
}

.search-box input{
  flex:1;
  border:0;
  outline:none;
  padding:14px;
  font-size:16px;
}

/* =========================
   CATEGORIES
========================= */

.categories{
  max-width:1200px;
  margin:0 auto 30px;
  padding:0 16px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
}

.category-btn{
  border:1px solid #d5dfdb;
  background:white;
  color:#21443b;
  padding:9px 16px;
  border-radius:30px;
  cursor:pointer;
  font-size:14px;
}

.category-btn:hover,
.category-btn.active{
  background:#0d5b48;
  color:white;
  border-color:#0d5b48;
}

/* =========================
   MAIN
========================= */

.container{
  max-width:1200px;
  margin:auto;
  padding:0 16px 60px;
}

.section-title{
  margin-bottom:22px;
}

.section-title h2{
  font-size:28px;
  color:#0d2b24;
}

.section-title p{
  color:#68736f;
}

/* =========================
   POSTS GRID
========================= */

.posts-grid{
  display:grid;
  grid-template-columns:
    repeat(3, minmax(0,1fr));
  gap:22px;
}

.post-card{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 5px 22px rgba(0,0,0,.07);
  transition:.25s;
  display:flex;
  flex-direction:column;
}

.post-card:hover{
  transform:translateY(-4px);
  box-shadow:0 10px 28px rgba(0,0,0,.12);
}

.post-image{
  width:100%;
  height:210px;
  object-fit:cover;
  background:#e8efec;
}

.post-content{
  padding:20px;
  display:flex;
  flex-direction:column;
  flex:1;
}

.post-category{
  display:inline-block;
  width:max-content;
  background:#e7f3ee;
  color:#0d5b48;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  margin-bottom:10px;
}

.post-title{
  font-size:20px;
  line-height:1.35;
  margin-bottom:8px;
  color:#17211f;
}

.post-excerpt{
  color:#66716d;
  font-size:14px;
  margin-bottom:15px;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.post-footer{
  margin-top:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.post-date{
  font-size:12px;
  color:#888;
}

.read-btn{
  background:#0d5b48;
  color:white;
  text-decoration:none;
  padding:8px 13px;
  border-radius:8px;
  font-size:13px;
  font-weight:bold;
}

.read-btn:hover{
  background:#083f33;
}

/* =========================
   STATES
========================= */

.loading{
  text-align:center;
  padding:50px 20px;
  color:#777;
}

.spinner{
  width:35px;
  height:35px;
  border:4px solid #dce5e1;
  border-top-color:#0d5b48;
  border-radius:50%;
  margin:0 auto 15px;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.empty{
  text-align:center;
  background:white;
  padding:45px 20px;
  border-radius:15px;
  color:#777;
}

.error{
  background:#fff0f0;
  color:#a52828;
  padding:20px;
  border-radius:12px;
  margin:20px 0;
  word-break:break-word;
}

/* =========================
   FOOTER
========================= */

footer{
  background:#0d2b24;
  color:white;
  padding:35px 18px;
  margin-top:20px;
}

.footer-inner{
  max-width:1100px;
  margin:auto;
  text-align:center;
}

.footer-logo{
  font-size:22px;
  font-weight:bold;
  margin-bottom:8px;
}

.footer-logo span{
  color:#d7b56d;
}

footer p{
  color:#bdccc7;
  font-size:14px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

  .posts-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

}

@media(max-width:650px){

  .navbar{
    padding:13px 14px;
  }

  .logo{
    font-size:20px;
  }

  .nav-links{
    gap:10px;
  }

  .nav-links a:not(.login-btn){
    display:none;
  }

  .hero{
    padding:55px 16px;
  }

  .hero h1{
    font-size:32px;
  }

  .hero p{
    font-size:15px;
  }

  .posts-grid{
    grid-template-columns:1fr;
  }

  .post-image{
    height:220px;
  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

  <div class="navbar">

    <div class="logo">
      Qalb<span>-e-Deen</span>
    </div>

    <nav class="nav-links">

      <a href="index.html">
        Home
      </a>

      <a href="#posts">
        Posts
      </a>

      <a href="login.html"
         class="login-btn">
        Login
      </a>

    </nav>

  </div>

</header>


<!-- =========================
     HERO
========================= -->

<section class="hero">

  <div class="hero-inner">

    <h1>
      Welcome to
      <span>Qalb-e-Deen</span>
    </h1>

    <p>
      The Heart of Deen — Explore Islamic knowledge,
      Quran, Hadith, Dua and beautiful reminders.
    </p>

  </div>

</section>


<!-- =========================
     SEARCH
========================= -->

<div class="search-area">

  <div class="search-box">

    <input
      id="searchInput"
      type="search"
      placeholder="Search posts..."
      autocomplete="off"
    >

  </div>

</div>


<!-- =========================
     CATEGORIES
========================= -->

<div class="categories">

  <button
    class="category-btn active"
    data-category="All">

    All

  </button>

  <button
    class="category-btn"
    data-category="Quran">

    Quran

  </button>

  <button
    class="category-btn"
    data-category="Hadith">

    Hadith

  </button>

  <button
    class="category-btn"
    data-category="Islamic Knowledge">

    Islamic Knowledge

  </button>

  <button
    class="category-btn"
    data-category="Dua">

    Dua

  </button>

  <button
    class="category-btn"
    data-category="Akhlaq">

    Akhlaq

  </button>

  <button
    class="category-btn"
    data-category="Lifestyle">

    Lifestyle

  </button>

  <button
    class="category-btn"
    data-category="News">

    News

  </button>

</div>


<!-- =========================
     POSTS
========================= -->

<main
  class="container"
  id="posts">

  <div class="section-title">

    <h2>
      Latest Posts
    </h2>

    <p>
      Discover our latest Islamic posts.
    </p>

  </div>


  <div id="postsArea">

    <div class="loading">

      <div class="spinner"></div>

      Loading posts...

    </div>

  </div>

</main>


<!-- =========================
     FOOTER
========================= -->

<footer>

  <div class="footer-inner">

    <div class="footer-logo">
      Qalb<span>-e-Deen</span>
    </div>

    <p>
      The Heart of Deen
    </p>

    <p>
      © 2026 Qalb-e-Deen. All rights reserved.
    </p>

  </div>

</footer>



<!-- =========================
     FIREBASE
========================= -->

<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";



/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyC4sRpUYVLURCkbAbfvUccL5n71Dveiik4",

  authDomain:
    "qalb-e-deen-b765a.firebaseapp.com",

  projectId:
    "qalb-e-deen-b765a",

  storageBucket:
    "qalb-e-deen-b765a.firebasestorage.app",

  messagingSenderId:
    "226972777842",

  appId:
    "1:226972777842:web:0d1439b9d4dc66d8bfb1eb"

};



/* =========================
   INITIALIZE FIREBASE
========================= */

const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);



/* =========================
   ELEMENTS
========================= */

const postsArea =
  document.getElementById(
    "postsArea"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );

const categoryButtons =
  document.querySelectorAll(
    ".category-btn"
  );



/* =========================
   DATA
========================= */

let allPosts = [];

let selectedCategory = "All";



/* =========================
   LOAD POSTS
========================= */

async function loadPosts(){

  postsArea.innerHTML = `

    <div class="loading">

      <div class="spinner"></div>

      Loading posts...

    </div>

  `;


  try{

    const postsQuery = query(

      collection(
        db,
        "posts"
      ),

      orderBy(
        "createdAt",
        "desc"
      )

    );


    const snapshot =
      await getDocs(
        postsQuery
      );


    allPosts = [];


    snapshot.forEach(

      postDoc => {

        allPosts.push({

          id:
            postDoc.id,

          ...postDoc.data()

        });

      }

    );


    renderPosts();


  }catch(error){

    console.error(
      "Firebase error:",
      error
    );


    postsArea.innerHTML = `

      <div class="error">

        <strong>
          Could not load posts.
        </strong>

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}



/* =========================
   RENDER POSTS
========================= */

function renderPosts(){

  const searchText =
    searchInput.value
      .trim()
      .toLowerCase();


  const filteredPosts =
    allPosts.filter(

      post => {

        const title =
          String(
            post.title || ""
          ).toLowerCase();


        const content =
          String(
            post.content || ""
          ).toLowerCase();


        const category =
          String(
            post.category || ""
          );


        const matchesSearch =

          !searchText ||

          title.includes(
            searchText
          ) ||

          content.includes(
            searchText
          );


        const matchesCategory =

          selectedCategory ===
          "All" ||

          category ===
          selectedCategory;


        return (
          matchesSearch &&
          matchesCategory
        );

      }

    );


  if(filteredPosts.length === 0){

    postsArea.innerHTML = `

      <div class="empty">

        <h3>
          No posts found
        </h3>

        <p>
          Try another search or category.
        </p>

      </div>

    `;

    return;

  }


  const grid =
    document.createElement(
      "div"
    );


  grid.className =
    "posts-grid";


  filteredPosts.forEach(

    post => {

      grid.appendChild(
        createPostCard(post)
      );

    }

  );


  postsArea.innerHTML = "";

  postsArea.appendChild(
    grid
  );

}



/* =========================
   POST CARD
========================= */

function createPostCard(
  post
){

  const card =
    document.createElement(
      "article"
    );


  card.className =
    "post-card";


  const image =
    post.imageURL ||
    "https://images.unsplash.com/photo-1609599006353-e629aaabfeae?auto=format&fit=crop&w=900&q=80";


  const title =
    post.title ||
    "Untitled Post";


  const category =
    post.category ||
    "General";


  const content =
    post.content ||
    "";


  const excerpt =
    content.length > 180

      ? content.substring(
          0,
          180
        ) + "..."

      : content;


  let date =
    "Recently";


  if(post.createdAt){

    try{

      date =
        post.createdAt
          .toDate()
          .toLocaleDateString(
            "en-US",
            {
              year:"numeric",
              month:"short",
              day:"numeric"
            }
          );

    }catch(error){

      console.log(
        "Date error:",
        error
      );

    }

  }


  card.innerHTML = `

    <img
      class="post-image"
      src="${escapeAttribute(image)}"
      alt="${escapeAttribute(title)}"
      loading="lazy"
      onerror="this.src='https://images.unsplash.com/photo-1609599006353-e629aaabfeae?auto=format&fit=crop&w=900&q=80'"
    >


    <div class="post-content">

      <span class="post-category">

        ${escapeHTML(category)}

      </span>


      <h3 class="post-title">

        ${escapeHTML(title)}

      </h3>


      <p class="post-excerpt">

        ${escapeHTML(excerpt)}

      </p>


      <div class="post-footer">

        <span class="post-date">

          ${escapeHTML(date)}

        </span>


        <a
          class="read-btn"
          href="post.html?id=${encodeURIComponent(post.id)}"
        >

          Read Post →

        </a>

      </div>

    </div>

  `;


  return card;

}



/* =========================
   SEARCH
========================= */

searchInput.addEventListener(

  "input",

  () => {

    renderPosts();

  }

);



/* =========================
   CATEGORY FILTER
========================= */

categoryButtons.forEach(

  button => {

    button.addEventListener(

      "click",

      () => {

        categoryButtons.forEach(
          btn =>
            btn.classList.remove(
              "active"
            )
        );


        button.classList.add(
          "active"
        );


        selectedCategory =
          button.dataset.category;


        renderPosts();

      }

    );

  }

);



/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(
  value
){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



function escapeAttribute(
  value
){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    );

}



/* =========================
   START
========================= */

loadPosts();

</script>


</body>
  </html>
