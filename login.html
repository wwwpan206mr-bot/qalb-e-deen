<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login / Sign Up — Qalb-e-Deen</title>

  <meta name="description"
        content="Login or create your account on Qalb-e-Deen — The Heart of Deen.">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial, Helvetica, sans-serif;
      min-height:100vh;
      background:
        radial-gradient(circle at top,#173b35 0%,#081512 45%,#050b0a 100%);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:430px;
    }

    .brand{
      text-align:center;
      margin-bottom:25px;
    }

    .brand-icon{
      width:70px;
      height:70px;
      margin:auto;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg,#d8b45a,#f3d98b);
      color:#10241f;
      font-size:32px;
      box-shadow:0 10px 35px rgba(216,180,90,.25);
    }

    .brand h1{
      margin-top:15px;
      font-family:Georgia,serif;
      font-size:32px;
      color:#f3d98b;
    }

    .brand p{
      margin-top:6px;
      color:#aebcb7;
      font-size:14px;
    }

    .card{
      background:rgba(15,31,27,.94);
      border:1px solid rgba(216,180,90,.18);
      border-radius:24px;
      padding:28px;
      box-shadow:0 20px 70px rgba(0,0,0,.45);
      backdrop-filter:blur(15px);
    }

    .tabs{
      display:flex;
      gap:8px;
      margin-bottom:25px;
      background:#091713;
      padding:5px;
      border-radius:14px;
    }

    .tab{
      width:50%;
      border:0;
      padding:12px;
      border-radius:10px;
      background:transparent;
      color:#9eaaa6;
      cursor:pointer;
      font-size:15px;
      font-weight:bold;
    }

    .tab.active{
      background:#d8b45a;
      color:#10241f;
    }

    .form{
      display:none;
    }

    .form.active{
      display:block;
    }

    .input-group{
      margin-bottom:16px;
    }

    label{
      display:block;
      margin-bottom:7px;
      color:#d8dfdc;
      font-size:14px;
    }

    input{
      width:100%;
      padding:14px 15px;
      border-radius:12px;
      border:1px solid #29443d;
      background:#081512;
      color:#fff;
      outline:none;
      font-size:15px;
      transition:.2s;
    }

    input:focus{
      border-color:#d8b45a;
      box-shadow:0 0 0 3px rgba(216,180,90,.08);
    }

    .btn{
      width:100%;
      padding:14px;
      border:0;
      border-radius:12px;
      background:linear-gradient(135deg,#d8b45a,#f0d487);
      color:#10241f;
      font-weight:bold;
      font-size:16px;
      cursor:pointer;
      margin-top:5px;
      transition:.2s;
    }

    .btn:hover{
      transform:translateY(-1px);
      box-shadow:0 8px 25px rgba(216,180,90,.2);
    }

    .btn:disabled{
      opacity:.6;
      cursor:not-allowed;
      transform:none;
    }

    .message{
      display:none;
      margin-bottom:16px;
      padding:12px;
      border-radius:10px;
      font-size:14px;
      line-height:1.5;
    }

    .message.show{
      display:block;
    }

    .message.error{
      background:rgba(220,70,70,.12);
      border:1px solid rgba(220,70,70,.3);
      color:#ffaaa5;
    }

    .message.success{
      background:rgba(70,190,130,.12);
      border:1px solid rgba(70,190,130,.3);
      color:#9ff0c7;
    }

    .small-text{
      text-align:center;
      margin-top:18px;
      color:#899993;
      font-size:13px;
      line-height:1.6;
    }

    .home-link{
      display:block;
      text-align:center;
      margin-top:20px;
      color:#d8b45a;
      text-decoration:none;
      font-size:14px;
    }

    .home-link:hover{
      text-decoration:underline;
    }

    .password-wrap{
      position:relative;
    }

    .password-wrap input{
      padding-right:55px;
    }

    .show-pass{
      position:absolute;
      right:12px;
      top:50%;
      transform:translateY(-50%);
      background:none;
      border:0;
      color:#9eaaa6;
      cursor:pointer;
      font-size:13px;
    }

    @media(max-width:480px){
      body{
        padding:14px;
      }

      .card{
        padding:22px 18px;
      }

      .brand h1{
        font-size:28px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="brand">
    <div class="brand-icon">☪</div>
    <h1>Qalb-e-Deen</h1>
    <p>The Heart of Deen</p>
  </div>

  <div class="card">

    <div class="tabs">
      <button class="tab active" id="loginTab">
        Login
      </button>

      <button class="tab" id="signupTab">
        Sign Up
      </button>
    </div>

    <div id="message" class="message"></div>

    <!-- LOGIN FORM -->
    <form id="loginForm" class="form active">

      <div class="input-group">
        <label for="loginEmail">Email Address</label>
        <input
          type="email"
          id="loginEmail"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >
      </div>

      <div class="input-group">
        <label for="loginPassword">Password</label>

        <div class="password-wrap">
          <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="show-pass"
            onclick="togglePassword('loginPassword', this)"
          >
            Show
          </button>
        </div>
      </div>

      <button class="btn" id="loginBtn" type="submit">
        Login
      </button>

      <p class="small-text">
        Welcome back to Qalb-e-Deen.
      </p>

    </form>


    <!-- SIGN UP FORM -->
    <form id="signupForm" class="form">

      <div class="input-group">
        <label for="signupName">Full Name</label>

        <input
          type="text"
          id="signupName"
          placeholder="Enter your full name"
          autocomplete="name"
          required
        >
      </div>

      <div class="input-group">
        <label for="signupEmail">Email Address</label>

        <input
          type="email"
          id="signupEmail"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >
      </div>

      <div class="input-group">
        <label for="signupPassword">Password</label>

        <div class="password-wrap">
          <input
            type="password"
            id="signupPassword"
            placeholder="Minimum 6 characters"
            autocomplete="new-password"
            minlength="6"
            required
          >

          <button
            type="button"
            class="show-pass"
            onclick="togglePassword('signupPassword', this)"
          >
            Show
          </button>
        </div>
      </div>

      <div class="input-group">
        <label for="signupConfirmPassword">Confirm Password</label>

        <div class="password-wrap">
          <input
            type="password"
            id="signupConfirmPassword"
            placeholder="Confirm your password"
            autocomplete="new-password"
            minlength="6"
            required
          >

          <button
            type="button"
            class="show-pass"
            onclick="togglePassword('signupConfirmPassword', this)"
          >
            Show
          </button>
        </div>
      </div>

      <button class="btn" id="signupBtn" type="submit">
        Create Account
      </button>

      <p class="small-text">
        By creating an account, you can build your profile
        and participate in the Qalb-e-Deen community.
      </p>

    </form>

  </div>

  <a href="index.html" class="home-link">
    ← Back to Qalb-e-Deen
  </a>

</div>


<!-- Firebase -->
<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    updateProfile
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getFirestore,
    doc,
    setDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  /* ==============================
     QALB-E-DEEN FIREBASE CONFIG
     ============================== */

  const firebaseConfig = {
    apiKey: "AIzaSyDQoJKty9i3BqBPehwKDemmSgXf9Oe9qo8",
    authDomain: "qalb-e-deen-6af8e.firebaseapp.com",
    projectId: "qalb-e-deen-6af8e",
    storageBucket: "qalb-e-deen-6af8e.firebasestorage.app",
    messagingSenderId: "983132945914",
    appId: "1:983132945914:web:c4cd95d50a5259cbbdf843"
  };


  /* ==============================
     INITIALIZE FIREBASE
     ============================== */

  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  /* ==============================
     ELEMENTS
     ============================== */

  const loginTab = document.getElementById("loginTab");
  const signupTab = document.getElementById("signupTab");

  const loginForm = document.getElementById("loginForm");
  const signupForm = document.getElementById("signupForm");

  const message = document.getElementById("message");

  const loginBtn = document.getElementById("loginBtn");
  const signupBtn = document.getElementById("signupBtn");


  /* ==============================
     SHOW MESSAGE
     ============================== */

  function showMessage(text, type = "error") {

    message.textContent = text;

    message.className = "message show " + type;

  }


  function clearMessage() {

    message.textContent = "";

    message.className = "message";

  }


  /* ==============================
     TABS
     ============================== */

  loginTab.addEventListener("click", () => {

    loginTab.classList.add("active");

    signupTab.classList.remove("active");

    loginForm.classList.add("active");

    signupForm.classList.remove("active");

    clearMessage();

  });


  signupTab.addEventListener("click", () => {

    signupTab.classList.add("active");

    loginTab.classList.remove("active");

    signupForm.classList.add("active");

    loginForm.classList.remove("active");

    clearMessage();

  });


  /* ==============================
     SIGN UP
     ============================== */

  signupForm.addEventListener("submit", async (e) => {

    e.preventDefault();

    clearMessage();

    const name =
      document.getElementById("signupName").value.trim();

    const email =
      document.getElementById("signupEmail").value.trim();

    const password =
      document.getElementById("signupPassword").value;

    const confirmPassword =
      document.getElementById("signupConfirmPassword").value;


    if (!name) {

      showMessage("Please enter your full name.");

      return;

    }


    if (password.length < 6) {

      showMessage("Password must be at least 6 characters.");

      return;

    }


    if (password !== confirmPassword) {

      showMessage("Passwords do not match.");

      return;

    }


    signupBtn.disabled = true;

    signupBtn.textContent = "Creating Account...";


    try {

      const userCredential =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );


      const user = userCredential.user;


      /* Update Firebase Auth profile */

      await updateProfile(user, {

        displayName: name

      });


      /* Save user information in Firestore */

      await setDoc(
        doc(db, "users", user.uid),
        {

          uid: user.uid,

          name: name,

          email: email,

          photoURL: "",

          bio: "",

          role: "user",

          createdAt: serverTimestamp(),

          updatedAt: serverTimestamp()

        },
        {
          merge: true
        }
      );


      showMessage(
        "Account created successfully! Redirecting...",
        "success"
      );


      setTimeout(() => {

        window.location.href = "profile.html";

      }, 1200);


    } catch (error) {

      console.error(error);

      let errorMessage =
        "Unable to create account.";

      if (error.code === "auth/email-already-in-use") {

        errorMessage =
          "This email is already registered.";

      } else if (error.code === "auth/invalid-email") {

        errorMessage =
          "Please enter a valid email address.";

      } else if (error.code === "auth/weak-password") {

        errorMessage =
          "Password is too weak.";

      } else if (error.code === "auth/network-request-failed") {

        errorMessage =
          "Network error. Please check your internet connection.";

      }

      showMessage(errorMessage);

    }


    signupBtn.disabled = false;

    signupBtn.textContent = "Create Account";

  });


  /* ==============================
     LOGIN
     ============================== */

  loginForm.addEventListener("submit", async (e) => {

    e.preventDefault();

    clearMessage();

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;


    loginBtn.disabled = true;

    loginBtn.textContent = "Logging in...";


    try {

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


      showMessage(
        "Login successful! Redirecting...",
        "success"
      );


      setTimeout(() => {

        window.location.href = "profile.html";

      }, 1000);


    } catch (error) {

      console.error(error);

      let errorMessage =
        "Login failed.";

      if (
        error.code === "auth/invalid-credential" ||
        error.code === "auth/wrong-password" ||
        error.code === "auth/user-not-found"
      ) {

        errorMessage =
          "Incorrect email or password.";

      } else if (error.code === "auth/invalid-email") {

        errorMessage =
          "Please enter a valid email address.";

      } else if (error.code === "auth/too-many-requests") {

        errorMessage =
          "Too many attempts. Please try again later.";

      }

      showMessage(errorMessage);

    }


    loginBtn.disabled = false;

    loginBtn.textContent = "Login";

  });


  /* ==============================
     CHECK CURRENT LOGIN
     ============================== */

  onAuthStateChanged(auth, (user) => {

    if (user) {

      console.log(
        "Logged in user:",
        user.uid
      );

    }

  });

</script>


<script>

  /* ==============================
     PASSWORD SHOW / HIDE
     ============================== */

  function togglePassword(id, button) {

    const input = document.getElementById(id);

    if (input.type === "password") {

      input.type = "text";

      button.textContent = "Hide";

    } else {

      input.type = "password";

      button.textContent = "Show";

    }

  }

</script>

</body>
  </html>
