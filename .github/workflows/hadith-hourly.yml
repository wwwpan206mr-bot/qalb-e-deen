name: Sync HadithAPI every hour

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-hadiths:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase Admin SDK
        run: npm install --no-save firebase-admin

      - name: Authenticate to Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          create_credentials_file: true

      - name: Fetch HadithAPI and sync to Firestore
        env:
          HADITH_API_KEY: ${{ secrets.HADITH_API_KEY }}
        run: node scripts/sync-hadiths.mjs
