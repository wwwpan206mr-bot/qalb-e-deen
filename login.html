<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login / Sign Up — Qalb-e-Deen</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #071b16, #0d3027, #071b16);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 430px;
      padding: 30px 25px;
      border-radius: 24px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(15px);
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      color: #d7b56d;
      font-size: 32px;
      margin-bottom: 6px;
    }

    .logo p {
      color: #c7d5d0;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 25px;
    }

    .tabs button {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,.08);
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    .tabs button.active {
      background: #d7b56d;
      color: #071b16;
      font-weight: bold;
    }

    form {
      display: none;
    }

    form.active {
      display: block;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      color: #d9e3df;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(0,0,0,.2);
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #d7b56d;
    }

    .main-btn {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #d7b56d;
      color: #071b16;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .main-btn:disabled {
      opacity: .6;
    }

    #message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
    }

    #message.success {
      display: block;
      background: rgba(50,180,110,.15);
      color: #a9f0c8;
    }

    #message.error {
      display: block;
      background: rgba(220,60,60,.15);
      color: #ffb1b1;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #d7b56d;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="box">

  <div class="logo">
    <h1>Qalb-e-Deen</h1>
    <p>The Heart of Deen</p>
  </div>

  <div class="tabs">
    <button id="loginTab" class="active">Login</button>
    <button id="signupTab">Sign Up</button>
  </div>


  <!-- LOGIN -->

  <form id="loginForm" class="active">

    <label>Email</label>

    <input
      type="email"
      id="loginEmail"
      placeholder="Enter your email"
      required
    >

    <label>Password</label>

    <input
      type="password"
      id="loginPassword"
      placeholder="Enter your password"
      required
    >

    <button
      type="submit"
      class="main-btn"
      id="loginBtn"
    >
      Login
    </button>

  </form>


  <!-- SIGN UP -->

  <form id="signupForm">

    <label>Full Name</label>

    <input
      type="text"
      id="signupName"
      placeholder="Enter your full name"
      required
    >

    <label>Email</label>

    <input
      type="email"
      id="signupEmail"
      placeholder="Enter your email"
      required
    >

    <label>Password</label>

    <input
      type="password"
      id="signupPassword"
      placeholder="Minimum 6 characters"
      minlength="6"
      required
    >

    <button
      type="submit"
      class="main-btn"
      id="signupBtn"
    >
      Create Account
    </button>

  </form>


  <div id="message"></div>

  <a href="index.html" class="back">
    ← Back to Qalb-e-Deen
  </a>

</div>


<script type="module">

  // =========================
  // FIREBASE IMPORTS
  // =========================

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    updateProfile
  }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getFirestore,
    doc,
    setDoc,
    serverTimestamp
  }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  // =========================
  // FIREBASE CONFIG
  // =========================

  const firebaseConfig = {

    apiKey:
      "AIzaSyDQoJKty9i3BqBPehwKDemmSgXf9Oe9qo8",

    authDomain:
      "qalb-e-deen-6af8e.firebaseapp.com",

    projectId:
      "qalb-e-deen-6af8e",

    storageBucket:
      "qalb-e-deen-6af8e.firebasestorage.app",

    messagingSenderId:
      "983132945914",

    appId:
      "1:983132945914:web:c4cd95d50a5259cbbdf843"
  };


  // =========================
  // INITIALIZE FIREBASE
  // =========================

  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  // =========================
  // ELEMENTS
  // =========================

  const loginTab =
    document.getElementById("loginTab");

  const signupTab =
    document.getElementById("signupTab");

  const loginForm =
    document.getElementById("loginForm");

  const signupForm =
    document.getElementById("signupForm");

  const loginBtn =
    document.getElementById("loginBtn");

  const signupBtn =
    document.getElementById("signupBtn");

  const message =
    document.getElementById("message");


  // =========================
  // MESSAGE
  // =========================

  function showMessage(text, type) {

    message.textContent = text;

    message.className = type;

  }


  function clearMessage() {

    message.textContent = "";

    message.className = "";

  }


  // =========================
  // LOGIN TAB
  // =========================

  loginTab.addEventListener("click", () => {

    loginTab.classList.add("active");

    signupTab.classList.remove("active");

    loginForm.classList.add("active");

    signupForm.classList.remove("active");

    clearMessage();

  });


  // =========================
  // SIGN UP TAB
  // =========================

  signupTab.addEventListener("click", () => {

    signupTab.classList.add("active");

    loginTab.classList.remove("active");

    signupForm.classList.add("active");

    loginForm.classList.remove("active");

    clearMessage();

  });


  // =========================
  // LOGIN
  // =========================

  loginForm.addEventListener("submit", async (e) => {

    e.preventDefault();

    clearMessage();

    const email =
      document.getElementById("loginEmail")
      .value
      .trim();

    const password =
      document.getElementById("loginPassword")
      .value;

    loginBtn.disabled = true;

    loginBtn.textContent = "Logging in...";


    try {

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


      showMessage(
        "Login successful! Redirecting...",
        "success"
      );


      setTimeout(() => {

        window.location.href = "profile.html";

      }, 1000);


    } catch (error) {

      console.error(error);

      showMessage(
        "Login failed: " + error.message,
        "error"
      );

    }


    loginBtn.disabled = false;

    loginBtn.textContent = "Login";

  });


  // =========================
  // SIGN UP
  // =========================

  signupForm.addEventListener("submit", async (e) => {

    e.preventDefault();

    clearMessage();


    const name =
      document.getElementById("signupName")
      .value
      .trim();

    const email =
      document.getElementById("signupEmail")
      .value
      .trim();

    const password =
      document.getElementById("signupPassword")
      .value;


    if (name.length < 2) {

      showMessage(
        "Please enter your full name.",
        "error"
      );

      return;

    }


    if (password.length < 6) {

      showMessage(
        "Password must be at least 6 characters.",
        "error"
      );

      return;

    }


    signupBtn.disabled = true;

    signupBtn.textContent = "Creating Account...";


    try {

      // STEP 1
      // Create Authentication account

      const result =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );


      const user = result.user;


      console.log(
        "Firebase Auth UID:",
        user.uid
      );


      // STEP 2
      // Save display name

      await updateProfile(user, {

        displayName: name

      });


      // STEP 3
      // Create Firestore profile

      const userRef =
        doc(db, "users", user.uid);


      await setDoc(userRef, {

        name: name,

        email: email,

        role: "user",

        bio: "",

        photoURL: "",

        createdAt: serverTimestamp(),

        updatedAt: serverTimestamp()

      });


      // STEP 4

      showMessage(
        "Account created successfully! Opening profile...",
        "success"
      );


      // STEP 5

      setTimeout(() => {

        window.location.href = "profile.html";

      }, 1200);


    } catch (error) {

      console.error(
        "SIGN UP ERROR:",
        error
      );


      showMessage(
        "Error: " + error.message,
        "error"
      );

    }


    signupBtn.disabled = false;

    signupBtn.textContent = "Create Account";

  });

</script>

</body>
</html>
