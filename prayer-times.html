<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prayer Times — Qalb-e-Deen</title>

  <meta
    name="description"
    content="Qalb-e-Deen — Today's Islamic prayer times for Dhaka, Bangladesh."
  >

  <meta name="theme-color" content="#0f766e">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Noto Sans Bengali", sans-serif;
      background:
        radial-gradient(circle at top, #dff7f1 0%, #f7faf9 45%, #eef5f3 100%);
      color: #173b37;
      min-height: 100vh;
    }

    .container {
      width: min(1100px, 94%);
      margin: auto;
    }

    header {
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #dceae6;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .nav {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      text-decoration: none;
      color: #0f766e;
      font-weight: 800;
      font-size: 20px;
    }

    .back-btn {
      text-decoration: none;
      background: #0f766e;
      color: white;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
    }

    main {
      padding: 28px 0 50px;
    }

    .hero {
      text-align: center;
      padding: 25px 10px 30px;
    }

    .hero h1 {
      font-size: clamp(28px, 6vw, 46px);
      margin-bottom: 8px;
    }

    .hero p {
      color: #61716e;
      line-height: 1.7;
    }

    .date-box {
      margin: 18px auto 0;
      display: inline-block;
      padding: 9px 16px;
      border-radius: 999px;
      background: #e2f3ef;
      color: #0f766e;
      font-weight: 700;
      font-size: 14px;
    }

    .next-card {
      background: linear-gradient(135deg, #0f766e, #115e59);
      color: white;
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 15px 35px rgba(15,118,110,.20);
      margin-bottom: 25px;
      text-align: center;
    }

    .next-label {
      font-size: 14px;
      opacity: .85;
      margin-bottom: 8px;
    }

    .next-name {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .next-time {
      font-size: 17px;
      opacity: .9;
    }

    .countdown {
      margin-top: 16px;
      font-size: clamp(34px, 9vw, 58px);
      font-weight: 900;
      letter-spacing: 2px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }

    .prayer-card {
      background: rgba(255,255,255,.94);
      border: 1px solid #dceae6;
      border-radius: 20px;
      padding: 22px 12px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,.05);
      transition: .2s;
    }

    .prayer-card:hover {
      transform: translateY(-3px);
    }

    .prayer-card.active {
      border: 2px solid #0f766e;
      background: #e9f8f4;
      box-shadow: 0 10px 28px rgba(15,118,110,.15);
    }

    .icon {
      font-size: 28px;
      margin-bottom: 9px;
    }

    .bn-name {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .en-name {
      color: #71807d;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .time {
      font-size: 21px;
      font-weight: 800;
      color: #0f766e;
    }

    .status {
      margin-top: 8px;
      font-size: 11px;
      color: #71807d;
    }

    .loading,
    .error {
      text-align: center;
      padding: 25px;
      border-radius: 18px;
      background: white;
      margin-bottom: 20px;
    }

    .error {
      color: #b42318;
    }

    .location {
      margin-top: 25px;
      padding: 18px;
      background: white;
      border: 1px solid #dceae6;
      border-radius: 18px;
      text-align: center;
      color: #657571;
      line-height: 1.8;
    }

    footer {
      text-align: center;
      padding: 25px 10px;
      color: #7b8986;
      font-size: 13px;
    }

    @media (max-width: 850px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 560px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .prayer-card:last-child {
        grid-column: span 2;
      }

      .next-card {
        padding: 22px 15px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container nav">
    <a href="index.html" class="brand">
      ☪ Qalb-e-Deen
    </a>

    <a href="index.html" class="back-btn">
      ← Home
    </a>
  </div>
</header>

<main>
  <div class="container">

    <section class="hero">
      <h1>নামাজের সময়সূচি</h1>

      <p>
        Today's Prayer Times
      </p>

      <div class="date-box" id="todayDate">
        Loading...
      </div>
    </section>

    <div id="loadingBox" class="loading">
      নামাজের সময়সূচি লোড হচ্ছে...
    </div>

    <div id="errorBox" class="error" style="display:none;">
      নামাজের সময়সূচি লোড করা যায়নি।
    </div>

    <section class="next-card" id="nextCard" style="display:none;">
      <div class="next-label">
        পরবর্তী ওয়াক্ত
      </div>

      <div class="next-name" id="nextName">
        —
      </div>

      <div class="next-time" id="nextTime">
        —
      </div>

      <div class="countdown" id="countdown">
        00:00:00
      </div>
    </section>

    <section class="grid" id="prayerGrid"></section>

    <div class="location">
      📍 <strong>Dhaka, Bangladesh</strong>
      <br>
      আজকের নামাজের সময়সূচি API থেকে স্বয়ংক্রিয়ভাবে নেওয়া হচ্ছে।
    </div>

  </div>
</main>

<footer>
  © <span id="year"></span> Qalb-e-Deen — The Heart of Deen
</footer>


<script type="module">

  /* ==============================
     FIREBASE CONFIG
  ============================== */

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getFirestore
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  const firebaseConfig = {
    apiKey: "AIzaSyC4sRpUYVLURCkbAbfvUccL5n71Dveiik4",
    authDomain: "qalb-e-deen-b765a.firebaseapp.com",
    projectId: "qalb-e-deen-b765a",
    storageBucket: "qalb-e-deen-b765a.firebasestorage.app",
    messagingSenderId: "226972777842",
    appId: "1:226972777842:web:0d1439b9d4dc66d8bfb1eb"
  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  /* ==============================
     SETTINGS
  ============================== */

  const CITY = "Dhaka";
  const COUNTRY = "Bangladesh";

  /*
    Method 1 = University of Islamic Sciences, Karachi

    School 1 = Hanafi
  */

  const METHOD = 1;
  const SCHOOL = 1;


  const prayers = [
    {
      key: "Fajr",
      bn: "ফজর",
      en: "Fajr",
      icon: "🌅"
    },
    {
      key: "Dhuhr",
      bn: "যোহর",
      en: "Dhuhr",
      icon: "☀️"
    },
    {
      key: "Asr",
      bn: "আসর",
      en: "Asr",
      icon: "🌤️"
    },
    {
      key: "Maghrib",
      bn: "মাগরিব",
      en: "Maghrib",
      icon: "🌇"
    },
    {
      key: "Isha",
      bn: "এশা",
      en: "Isha",
      icon: "🌙"
    }
  ];


  let prayerTimes = {};
  let nextPrayer = null;
  let countdownTimer = null;


  /* ==============================
     DATE
  ============================== */

  function getTodayString() {

    const now = new Date();

    const day = String(now.getDate()).padStart(2, "0");

    const month = String(now.getMonth() + 1).padStart(2, "0");

    const year = now.getFullYear();

    return `${day}-${month}-${year}`;
  }


  function showDate() {

    const now = new Date();

    const options = {
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric"
    };

    document.getElementById("todayDate").textContent =
      now.toLocaleDateString("bn-BD", options);
  }


  /* ==============================
     TIME HELPERS
  ============================== */

  function convertToMinutes(time) {

    const clean = time.split(" ")[0];

    const [hours, minutes] = clean.split(":").map(Number);

    return hours * 60 + minutes;
  }


  function formatTime(time) {

    const [h, m] = time.split(":").map(Number);

    const date = new Date();

    date.setHours(h, m, 0, 0);

    return date.toLocaleTimeString("en-US", {
      hour: "numeric",
      minute: "2-digit"
    });
  }


  function getPrayerDate(time) {

    const [h, m] = time.split(":").map(Number);

    const date = new Date();

    date.setHours(h, m, 0, 0);

    return date;
  }


  /* ==============================
     LOAD API
  ============================== */

  async function loadPrayerTimes() {

    try {

      document.getElementById("loadingBox").style.display = "block";

      document.getElementById("errorBox").style.display = "none";

      const date = getTodayString();

      const url =
        `https://api.aladhan.com/v1/timingsByCity/${date}` +
        `?city=${encodeURIComponent(CITY)}` +
        `&country=${encodeURIComponent(COUNTRY)}` +
        `&method=${METHOD}` +
        `&school=${SCHOOL}` +
        `&iso8601=false`;


      const response = await fetch(url);

      if (!response.ok) {
        throw new Error("API request failed");
      }


      const result = await response.json();


      if (
        !result ||
        result.code !== 200 ||
        !result.data ||
        !result.data.timings
      ) {
        throw new Error("Invalid API response");
      }


      prayerTimes = result.data.timings;


      renderPrayerCards();

      findNextPrayer();

      document.getElementById("loadingBox").style.display = "none";

      document.getElementById("nextCard").style.display = "block";


    } catch (error) {

      console.error(error);

      document.getElementById("loadingBox").style.display = "none";

      document.getElementById("errorBox").style.display = "block";

    }

  }


  /* ==============================
     RENDER
  ============================== */

  function renderPrayerCards() {

    const grid = document.getElementById("prayerGrid");

    grid.innerHTML = "";


    prayers.forEach(prayer => {

      const time = prayerTimes[prayer.key];

      if (!time) return;


      const card = document.createElement("div");

      card.className = "prayer-card";

      card.dataset.key = prayer.key;


      card.innerHTML = `

        <div class="icon">
          ${prayer.icon}
        </div>

        <div class="bn-name">
          ${prayer.bn}
        </div>

        <div class="en-name">
          ${prayer.en}
        </div>

        <div class="time">
          ${formatTime(time)}
        </div>

        <div class="status">
          ${prayer.key}
        </div>

      `;


      grid.appendChild(card);

    });

  }


  /* ==============================
     FIND NEXT PRAYER
  ============================== */

  function findNextPrayer() {

    const now = new Date();

    let found = null;


    for (const prayer of prayers) {

      const time = prayerTimes[prayer.key];

      if (!time) continue;


      const prayerDate = getPrayerDate(time);


      if (prayerDate > now) {

        found = {
          ...prayer,
          time,
          date: prayerDate
        };

        break;

      }

    }


    /*
      If all five prayers have passed,
      next prayer becomes tomorrow's Fajr.
    */

    if (!found) {

      const fajrTime = prayerTimes["Fajr"];

      const fajrDate = getPrayerDate(fajrTime);

      fajrDate.setDate(fajrDate.getDate() + 1);


      found = {
        ...prayers[0],
        time: fajrTime,
        date: fajrDate,
        tomorrow: true
      };

    }


    nextPrayer = found;


    document.getElementById("nextName").textContent =
      `${found.bn} (${found.en})`;


    document.getElementById("nextTime").textContent =
      found.tomorrow
        ? `আগামীকাল • ${formatTime(found.time)}`
        : `আজ • ${formatTime(found.time)}`;


    highlightNextPrayer();

    updateCountdown();

  }


  /* ==============================
     HIGHLIGHT
  ============================== */

  function highlightNextPrayer() {

    document
      .querySelectorAll(".prayer-card")
      .forEach(card => {

        card.classList.remove("active");

      });


    if (!nextPrayer) return;


    const activeCard =
      document.querySelector(
        `.prayer-card[data-key="${nextPrayer.key}"]`
      );


    if (activeCard) {

      activeCard.classList.add("active");

    }

  }


  /* ==============================
     COUNTDOWN
  ============================== */

  function updateCountdown() {

    if (!nextPrayer) return;


    const now = new Date();

    let difference =
      nextPrayer.date.getTime() - now.getTime();


    if (difference <= 0) {

      findNextPrayer();

      return;

    }


    const hours =
      Math.floor(difference / 3600000);


    difference %= 3600000;


    const minutes =
      Math.floor(difference / 60000);


    difference %= 60000;


    const seconds =
      Math.floor(difference / 1000);


    const formatted =
      `${String(hours).padStart(2, "0")}:` +
      `${String(minutes).padStart(2, "0")}:` +
      `${String(seconds).padStart(2, "0")}`;


    document.getElementById("countdown").textContent =
      formatted;

  }


  /* ==============================
     AUTO REFRESH
  ============================== */

  setInterval(updateCountdown, 1000);


  /*
    Reload API every 30 minutes
    so the page stays updated.
  */

  setInterval(loadPrayerTimes, 30 * 60 * 1000);


  /* ==============================
     START
  ============================== */

  document.getElementById("year").textContent =
    new Date().getFullYear();


  showDate();

  loadPrayerTimes();

</script>

</body>
</html>
