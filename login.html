<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login / Sign Up — Qalb-e-Deen</title>

  <meta
    name="description"
    content="Login or create your account on Qalb-e-Deen — The Heart of Deen."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background:
        linear-gradient(135deg, #061b16, #0b3027, #10251f);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      font-size: 32px;
      color: #d8b46a;
      margin-bottom: 7px;
    }

    .logo p {
      color: #b9c8c2;
      font-size: 14px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 22px;
      padding: 28px;
      backdrop-filter: blur(15px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 25px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      background: rgba(255,255,255,0.08);
      color: #bbb;
    }

    .tab.active {
      background: #d8b46a;
      color: #10251f;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 24px;
    }

    .input-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      color: #d5dedb;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      outline: none;
      background: rgba(0,0,0,0.25);
      color: #fff;
      font-size: 15px;
    }

    input:focus {
      border-color: #d8b46a;
    }

    input::placeholder {
      color: #87948f;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 11px;
      background: #d8b46a;
      color: #10251f;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      padding: 11px;
      border-radius: 9px;
      display: none;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: rgba(46, 204, 113, 0.15);
      color: #7ff0aa;
    }

    .error {
      display: block;
      background: rgba(231, 76, 60, 0.15);
      color: #ff9b91;
    }

    .back {
      text-align: center;
      margin-top: 20px;
    }

    .back a {
      color: #d8b46a;
      text-decoration: none;
      font-size: 14px;
    }

    .small-text {
      text-align: center;
      color: #9eaaa6;
      font-size: 12px;
      margin-top: 18px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    <h1>Qalb-e-Deen</h1>
    <p>The Heart of Deen</p>
  </div>

  <div class="card">

    <div class="tabs">
      <button id="loginTab" class="tab active">
        Login
      </button>

      <button id="signupTab" class="tab">
        Sign Up
      </button>
    </div>


    <!-- LOGIN FORM -->
    <div id="loginForm" class="form active">

      <h2>Welcome Back</h2>

      <div class="input-group">
        <label>Email Address</label>
        <input
          type="email"
          id="loginEmail"
          placeholder="Enter your email"
          autocomplete="email"
        >
      </div>

      <div class="input-group">
        <label>Password</label>
        <input
          type="password"
          id="loginPassword"
          placeholder="Enter your password"
          autocomplete="current-password"
        >
      </div>

      <button id="loginBtn" class="btn">
        Login
      </button>

      <div id="loginMessage" class="message"></div>

    </div>


    <!-- SIGN UP FORM -->
    <div id="signupForm" class="form">

      <h2>Create Account</h2>

      <div class="input-group">
        <label>Your Name</label>
        <input
          type="text"
          id="signupName"
          placeholder="Enter your name"
          autocomplete="name"
        >
      </div>

      <div class="input-group">
        <label>Email Address</label>
        <input
          type="email"
          id="signupEmail"
          placeholder="Enter your email"
          autocomplete="email"
        >
      </div>

      <div class="input-group">
        <label>Password</label>
        <input
          type="password"
          id="signupPassword"
          placeholder="Minimum 6 characters"
          autocomplete="new-password"
        >
      </div>

      <div class="input-group">
        <label>Confirm Password</label>
        <input
          type="password"
          id="signupConfirmPassword"
          placeholder="Confirm your password"
          autocomplete="new-password"
        >
      </div>

      <button id="signupBtn" class="btn">
        Create Account
      </button>

      <div id="signupMessage" class="message"></div>

    </div>


    <div class="back">
      <a href="index.html">← Back to Qalb-e-Deen</a>
    </div>

    <div class="small-text">
      By creating an account, you agree to use Qalb-e-Deen respectfully
      and responsibly.
    </div>

  </div>

</div>


<!-- Firebase -->
<script type="module">

  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    updateProfile
  } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  import {
    getFirestore,
    doc,
    setDoc,
    serverTimestamp
  } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


  // =========================================
  // FIREBASE CONFIG
  // =========================================

  const firebaseConfig = {

    apiKey: "AIzaSyC4sRpUYVLURCkbAbfvUccL5n71Dveiik4",

    authDomain:
      "qalb-e-deen-b765a.firebaseapp.com",

    projectId:
      "qalb-e-deen-b765a",

    storageBucket:
      "qalb-e-deen-b765a.firebasestorage.app",

    messagingSenderId:
      "226972777842",

    appId:
      "1:226972777842:web:0d1439b9d4dc66d8bfb1eb"
  };


  // Initialize Firebase
  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  // =========================================
  // ELEMENTS
  // =========================================

  const loginTab =
    document.getElementById("loginTab");

  const signupTab =
    document.getElementById("signupTab");

  const loginForm =
    document.getElementById("loginForm");

  const signupForm =
    document.getElementById("signupForm");

  const loginBtn =
    document.getElementById("loginBtn");

  const signupBtn =
    document.getElementById("signupBtn");


  // =========================================
  // TAB SWITCH
  // =========================================

  loginTab.addEventListener("click", () => {

    loginTab.classList.add("active");
    signupTab.classList.remove("active");

    loginForm.classList.add("active");
    signupForm.classList.remove("active");

  });


  signupTab.addEventListener("click", () => {

    signupTab.classList.add("active");
    loginTab.classList.remove("active");

    signupForm.classList.add("active");
    loginForm.classList.remove("active");

  });


  // =========================================
  // MESSAGE FUNCTION
  // =========================================

  function showMessage(element, message, type) {

    element.textContent = message;

    element.className =
      "message " + type;

  }


  function firebaseError(error) {

    switch (error.code) {

      case "auth/email-already-in-use":
        return "This email is already registered.";

      case "auth/invalid-email":
        return "Please enter a valid email address.";

      case "auth/weak-password":
        return "Password must be at least 6 characters.";

      case "auth/invalid-credential":
        return "Incorrect email or password.";

      case "auth/user-not-found":
        return "No account found with this email.";

      case "auth/wrong-password":
        return "Incorrect password.";

      case "permission-denied":
        return "Firestore permission denied. Please check Firestore Rules.";

      default:
        return error.message || "Something went wrong.";
    }

  }


  // =========================================
  // SIGN UP
  // =========================================

  signupBtn.addEventListener("click", async () => {

    const name =
      document.getElementById("signupName").value.trim();

    const email =
      document.getElementById("signupEmail").value.trim();

    const password =
      document.getElementById("signupPassword").value;

    const confirmPassword =
      document.getElementById("signupConfirmPassword").value;

    const message =
      document.getElementById("signupMessage");


    // Validation

    if (!name) {

      showMessage(
        message,
        "Please enter your name.",
        "error"
      );

      return;
    }


    if (!email) {

      showMessage(
        message,
        "Please enter your email.",
        "error"
      );

      return;
    }


    if (password.length < 6) {

      showMessage(
        message,
        "Password must be at least 6 characters.",
        "error"
      );

      return;
    }


    if (password !== confirmPassword) {

      showMessage(
        message,
        "Passwords do not match.",
        "error"
      );

      return;
    }


    signupBtn.disabled = true;

    signupBtn.textContent =
      "Creating Account...";


    try {

      // Create Firebase Authentication account

      const userCredential =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );


      const user =
        userCredential.user;


      // Update Firebase Auth profile

      await updateProfile(user, {

        displayName: name

      });


      // =====================================
      // CREATE FIRESTORE USER PROFILE
      // Collection: user
      // Document: UID
      // =====================================

      await setDoc(
        doc(db, "user", user.uid),
        {

          uid: user.uid,

          name: name,

          email: email,

          role: "user",

          bio: "",

          photoURL: "",

          createdAt: serverTimestamp(),

          updatedAt: serverTimestamp()

        }
      );


      showMessage(
        message,
        "Account created successfully! Redirecting...",
        "success"
      );


      setTimeout(() => {

        window.location.href =
          "profile.html";

      }, 1200);


    } catch (error) {

      console.error(
        "SIGN UP ERROR:",
        error
      );

      showMessage(
        message,
        firebaseError(error),
        "error"
      );

    } finally {

      signupBtn.disabled = false;

      signupBtn.textContent =
        "Create Account";

    }

  });


  // =========================================
  // LOGIN
  // =========================================

  loginBtn.addEventListener("click", async () => {

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;

    const message =
      document.getElementById("loginMessage");


    if (!email || !password) {

      showMessage(
        message,
        "Please enter email and password.",
        "error"
      );

      return;
    }


    loginBtn.disabled = true;

    loginBtn.textContent =
      "Logging in...";


    try {

      // Firebase Login

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


      showMessage(
        message,
        "Login successful! Redirecting...",
        "success"
      );


      setTimeout(() => {

        window.location.href =
          "profile.html";

      }, 800);


    } catch (error) {

      console.error(
        "LOGIN ERROR:",
        error
      );

      showMessage(
        message,
        firebaseError(error),
        "error"
      );

    } finally {

      loginBtn.disabled = false;

      loginBtn.textContent =
        "Login";

    }

  });

</script>

</body>
</html>
